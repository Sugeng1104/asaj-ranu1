<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian ASAJ Kelas 4 - SDN Ranuklindungan I</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .emas-menyala {
            color: #fbbf24;
            text-shadow: 0 0 12px rgba(251,191,36,.9), 0 0 25px rgba(251,191,36,.6);
            font-weight: 800;
        }
        .animate-fade-in { animation: fadeIn .4s ease-out; }
        @keyframes fadeIn {
            from { opacity:0; transform: translateY(10px); }
            to { opacity:1; transform: translateY(0); }
        }
        #container-video-pengawas video {
            aspect-ratio:1/1;
            object-fit:cover;
        }
    </style>
</head>

<body class="bg-[#f8fafc] min-h-screen flex flex-col">

<!-- ================= LOGIN ================= -->
<div id="login-section" class="flex-grow flex items-center justify-center p-6">
    <div class="bg-white rounded-[30px] shadow-xl shadow-slate-200/60 p-10 w-full max-w-md border border-slate-100 text-center">
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Login Peserta</h1>
        <p class="text-sm text-slate-400 mb-8 font-medium tracking-wide uppercase">ASAJ Kelas 4</p>

        <form onsubmit="prosesLoginSiswa(event)" class="space-y-5 text-left">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">
                    Nama Siswa
                </label>
                <input type="text" id="username" required autocomplete="off"
                    class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl font-semibold
                    focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all"
                    placeholder="Tulis nama lengkap siswa">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 transition-all active:scale-[0.98] mt-4">
                Masuk Ruang Ujian Matematika
            </button>
        </form>
    </div>
</div>

<!-- ================= UJIAN (ASLI, TIDAK DIUBAH) ================= -->
<div id="exam-section" class="hidden flex-col flex-grow animate-fade-in">
    <!-- SELURUH ISI UJIAN ANDA TETAP 100% -->
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxZO_VfKAa8VC8SpAr-jIhYa82wpeHqTH6iYVJV6uclV1YpYRL7QeqboB6v2Z6Apd1i-A/exec';
const GITHUB_USERNAME = 'sugeng1104';
const GITHUB_REPO = 'asaj-ranu1';

let dataSoalUjian = [];
let indexSoalAktif = 0;
let mapJawabanSiswa = {};
let sisaWaktuDetik = 90 * 60;
let intervalTimer = null;
let mapelPilihanSiswa = "MATEMATIKA";
let streamKamera = null;

document.addEventListener("DOMContentLoaded", function() {
    const sesi = localStorage.getItem("sesi_siswa_asaj_kls4");
    if (sesi) {
        bukaHalamanUjian(JSON.parse(sesi));
    }
});

function prosesLoginSiswa(event) {
    event.preventDefault();
    const nama = document.getElementById("username").value.trim();
    if (!nama) return alert("Nama wajib diisi");

    const dataSiswa = {
        nama_lengkap: nama.toUpperCase(),
        id_siswa: "SIS-" + Date.now()
    };

    localStorage.setItem("sesi_siswa_asaj_kls4", JSON.stringify(dataSiswa));
    localStorage.setItem("asaj_mapel_kls4", mapelPilihanSiswa);

    bukaHalamanUjian(dataSiswa);
}
</script>

</body>
</html>
