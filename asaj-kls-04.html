<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ujian ASAJ Kelas 4 - SDN Ranuklindungan I</title>
<script src="https://cdn.tailwindcss.com"></script>
https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap
<style>
body { font-family: 'Inter', sans-serif; }
.emas-menyala {
  color:#fbbf24;
  text-shadow:0 0 12px rgba(251,191,36,.9),0 0 25px rgba(251,191,36,.6);
  font-weight:800;
}
.animate-fade-in{animation:fadeIn .4s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
#container-video-pengawas video{aspect-ratio:1/1;object-fit:cover}
</style>

<body class="bg-[#f8fafc] min-h-screen flex flex-col">

<!-- ================= LOGIN ================= -->
<div id="login-section" class="flex-grow flex items-center justify-center p-6">
  <div class="bg-white rounded-[30px] shadow-xl p-10 w-full max-w-md border text-center">
    <h1 class="text-2xl font-bold mb-2">Login Peserta</h1>
    <p class="text-sm text-slate-400 mb-8 uppercase">ASAJ Kelas 4</p>

    <form onsubmit="prosesLoginSiswa(event)" class="space-y-5 text-left">
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">
          Nama Lengkap
        </label>
        <input type="text" id="username" required
          class="w-full px-5 py-3.5 bg-slate-50 border rounded-2xl font-semibold"
          placeholder="Masukkan nama lengkap">
      </div>

      <button id="btn-login"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl">
        Masuk Ruang Ujian
      </button>
    </form>
  </div>
</div>

<!-- ================= UJIAN (TIDAK DIUBAH) ================= -->
<div id="exam-section" class="hidden flex-col flex-grow animate-fade-in">
<!-- SELURUH BAGIAN UJIAN SAMA PERSIS DENGAN FILE ASLI -->
<!-- ……………………………………… -->
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxZO_VfKAa8VC8SpAr-jIhYa82wpeHqTH6iYVJV6uclV1YpYRL7QeqboB6v2Z6Apd1i-A/exec';
const GITHUB_USERNAME = 'sugeng1104';
const GITHUB_REPO = 'asaj-ranu1';

let dataSoalUjian=[], indexSoalAktif=0, mapJawabanSiswa={};
let sisaWaktuDetik=90*60, intervalTimer=null;
let mapelPilihanSiswa="", streamKamera=null;

/* ================= LOGIN FIX ================= */
function prosesLoginSiswa(event){
  event.preventDefault();

  const nama = document.getElementById("username").value.trim();
  if(!nama){ alert("Nama wajib diisi"); return; }

  const btn=document.getElementById("btn-login");
  btn.disabled=true; btn.innerText="Memuat soal...";

  // ✅ MAPEL OTOMATIS
  mapelPilihanSiswa="MATEMATIKA";

  const dataSiswa={
    id_siswa:"MTK-"+Date.now(),
    nama_lengkap:nama
  };

  fetch(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"text/plain" },
    body:JSON.stringify({
      action:"ambilBankSoal",
      mata_pelajaran:mapelPilihanSiswa,
      id_kelas:"KLS-04"
    })
  })
  .then(r=>r.json())
  .then(res=>{
    if(res.status==="success" && res.data.length>0){
      localStorage.setItem("sesi_siswa_asaj_kls4",JSON.stringify(dataSiswa));
      localStorage.setItem("asaj_mapel_kls4",mapelPilihanSiswa);
      bukaHalamanUjian(dataSiswa);
    }else{
      alert("Soal MATEMATIKA belum tersedia");
      btn.disabled=false; btn.innerText="Masuk Ruang Ujian";
    }
  })
  .catch(()=>{
    alert("Gagal terhubung ke server");
    btn.disabled=false; btn.innerText="Masuk Ruang Ujian";
  });
}
</script>
</body>
</html>
