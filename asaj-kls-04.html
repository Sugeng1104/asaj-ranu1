<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Ujian Sekolah ASAJ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            user-select: none;
            -moz-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
        }
        .unselectable {
            -webkit-user-drag: none;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800">

    <div id="halaman-login" class="min-h-screen flex items-center justify-center px-4 py-12 sm:px-6 lg:px-8 bg-gradient-to-br from-blue-600 to-indigo-900">
        <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-2xl transition-all">
            <div class="text-center">
                <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-indigo-100 text-indigo-600 mb-4 text-3xl">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h2 class="text-3xl font-extrabold text-slate-900">Ujian Digital ASAJ</h2>
                <p class="mt-2 text-sm text-slate-600">Silakan lengkapi data login untuk memulai ujian</p>
            </div>
            
            <form class="mt-8 space-y-5" onsubmit="event.preventDefault(); prosesLoginSiswa();">
                <div>
                    <label for="select-kelas" class="block text-sm font-medium text-slate-700 mb-1">Pilih Kelas</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-school"></i>
                        </span>
                        <select id="select-kelas" class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm appearance-none cursor-pointer">
                            <option value="">-- Memuat Daftar Kelas... --</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label for="select-mapel" class="block text-sm font-medium text-slate-700 mb-1">Mata Pelajaran</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-book-bookmark"></i>
                        </span>
                        <select id="select-mapel" class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm appearance-none cursor-pointer">
                            <option value="">-- Pilih Mata Pelajaran --</option>
                            <option value="PANCASILA">PANCASILA</option>
                            <option value="BAHASA INDONESIA">BAHASA INDONESIA</option>
                            <option value="IPAS">IPAS</option>
                            <option value="BAHASA INGGRIS">BAHASA INGGRIS</option>
                            <option value="MATEMATIKA">MATEMATIKA</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label for="input-username" class="block text-sm font-medium text-slate-700 mb-1">Username Murid</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input id="input-username" type="text" placeholder="Masukkan username Anda" class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                    </div>
                </div>

                <div>
                    <label for="input-token" class="block text-sm font-medium text-slate-700 mb-1">Token PIN Ujian</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input id="input-token" type="password" placeholder="6 digit nomor token" class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                    </div>
                </div>

                <div class="pt-2">
                    <button id="btn-login" type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors cursor-pointer">
                        <i class="fa-solid fa-right-to-bracket mr-2 mt-0.5"></i> Masuk & Kerjakan Ujian
                    </button>
                </div>
            </form>
        </div>
    </div>


    <div id="halaman-ujian" class="hidden min-h-screen flex flex-col">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-50 px-4 py-3 shadow-xs">
            <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-indigo-50 rounded-lg text-indigo-600 font-bold text-xl">
                        <i class="fa-solid fa-file-signature"></i>
                    </div>
                    <div>
                        <h1 id="txt-display-nama" class="font-bold text-slate-900 text-base leading-tight">Nama Siswa</h1>
                        <p id="txt-display-meta" class="text-xs text-slate-500">Kelas -- | Mapel: --</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 bg-amber-50 text-amber-800 px-4 py-2 rounded-xl border border-amber-200 font-mono font-bold text-sm">
                        <i class="fa-regular fa-clock text-base animate-pulse"></i>
                        <span id="txt-timer">--:--:--</span>
                    </div>
                    <button onclick="konfirmasiSelesaiUjian();" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-xs transition-colors cursor-pointer">
                        <i class="fa-solid fa-paper-plane mr-1.5"></i> Kumpulkan Jawaban
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-4 gap-6">
            <section class="lg:col-span-3 flex flex-col gap-4">
                <div class="bg-white p-6 rounded-2xl shadow-xs border border-slate-200">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                        <span id="label-nomor-soal" class="bg-indigo-600 text-white font-bold text-xs px-3 py-1.5 rounded-lg">SOAL NOMOR 1</span>
                        <span id="label-bobot-soal" class="text-xs font-medium text-slate-500">Bobot Nilai: 1</span>
                    </div>

                    <div id="box-gambar-soal" class="hidden mb-4 justify-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <img id="img-soal" src="" alt="Gambar Soal" class="max-h-72 object-contain rounded-lg shadow-xs unselectable">
                    </div>

                    <div id="txt-pertanyaan" class="text-slate-800 text-base font-medium leading-relaxed mb-6 whitespace-pre-line">
                        Memuat butir teks soal ujian...
                    </div>

                    <div id="container-pilihan" class="space-y-3">
                        </div>
                </div>

                <div class="flex justify-between items-center">
                    <button id="btn-prev" onclick="navigasiSoal(-1);" class="flex items-center px-4 py-2.5 bg-white border border-slate-300 text-slate-700 font-bold text-xs rounded-xl hover:bg-slate-50 shadow-xs transition-all disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
                        <i class="fa-solid fa-arrow-left mr-2"></i> Soal Sebelumnya
                    </button>
                    <button id="btn-next" onclick="navigasiSoal(1);" class="flex items-center px-5 py-2.5 bg-indigo-600 text-white font-bold text-xs rounded-xl hover:bg-indigo-700 shadow-md transition-all disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
                        Soal Berikutnya <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </section>

            <section class="bg-white p-5 rounded-2xl shadow-xs border border-slate-200 h-fit sticky top-20">
                <h3 class="font-bold text-slate-900 text-sm mb-3 pb-2 border-b border-slate-100">💻 Lembar Navigasi Soal</h3>
                
                <div id="grid-nomor" class="grid grid-cols-5 gap-2 max-h-72 overflow-y-auto pr-1">
                    </div>

                <div class="mt-5 pt-3 border-t border-slate-100 text-[11px] text-slate-500 space-y-1.5">
                    <div class="flex items-center gap-2"><span class="w-3 h-3 bg-indigo-600 rounded-sm inline-block"></span> Posisi Aktif</div>
                    <div class="flex items-center gap-2"><span class="w-3 h-3 bg-emerald-500 rounded-sm inline-block"></span> Sudah Dijawab</div>
                    <div class="flex items-center gap-2"><span class="w-3 h-3 bg-slate-200 rounded-sm inline-block"></span> Belum Diisi</div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // --- CONFIG: PASTE URL GOOGLE APPS SCRIPT ANDA DI SINI ---
        const URL_BACKEND = "https://script.google.com/macros/s/GANTI_DENGAN_URL_WEB_APP_ANDA/exec";

        // State Penyimpanan Aplikasi Lokal
        let stateUjian = {
            idSiswa: "",
            namaLengkap: "",
            idKelas: "",
            mapel: "",
            daftarSoal: [],
            jawabanSiswa: {}, // Format -> id_soal: "A"
            indeksAktif: 0,
            durasiMenit: 90, // Atur default waktu pengerjaan (90 Menit)
            sisaWaktuDetik: 0,
            timerInterval: null
        };

        // Ambil Data Kelas Saat Aplikasi Pertama Kali Dibuka
        document.addEventListener("DOMContentLoaded", function() {
            ambilDaftarKelas();
            proteksiKecurangan();
        });

        // 1. Fungsi Mengambil Daftar Kelas dari Spreadsheet (GET)
        function ambilDaftarKelas() {
            fetch(`${URL_BACKEND}?action=ambilKelas`)
            .then(res => res.json())
            .then(respon => {
                const selectBox = document.getElementById("select-kelas");
                selectBox.innerHTML = '<option value="">-- Pilih Kelas Anda --</option>';
                if(respon.status === "success" && respon.data.length > 0) {
                    respon.data.forEach(kelas => {
                        let opt = document.createElement("option");
                        opt.value = kelas.id;
                        opt.textContent = kelas.nama;
                        selectBox.appendChild(opt);
                    });
                } else {
                    selectBox.innerHTML = '<option value="">Gagal memuat kelas / Data kosong</option>';
                }
            })
            .catch(err => {
                console.error(err);
                alert("Gagal menghubungi server database kelas.");
            });
        }

        // 2. Handler Utama: Validasi Login, Saklar Mapel Aktif & Verifikasi Akun
        async function prosesLoginSiswa() {
            const btnLogin = document.getElementById("btn-login");
            const selectKelas = document.getElementById("select-kelas").value;
            const selectMapel = document.getElementById("select-mapel").value;
            const userInp = document.getElementById("input-username").value.trim();
            const tokenInp = document.getElementById("input-token").value.trim();

            if (!selectKelas || !selectMapel || !userInp || !tokenInp) {
                alert("Peringatan: Semua kolom isian formulir login wajib dilengkapi!");
                return;
            }

            // Ubah tombol ke state memproses data
            btnLogin.disabled = true;
            btnLogin.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-2"></i> Memproses Verifikasi...';

            try {
                // LANGKAH 1: Deteksi Saklar Status Ujian Aktif dari Admin (POST)
                const resSaklar = await fetch(URL_BACKEND, {
                    method: "POST",
                    body: JSON.stringify({ action: "getMapelAktif", id_kelas: selectKelas })
                });
                const dataSaklar = await resSaklar.json();

                const serverMapelAktif = dataSaklar.mapel_aktif ? dataSaklar.mapel_aktif.toString().toUpperCase().trim() : "";
                const userMapelPilihan = selectMapel.toString().toUpperCase().trim();

                // Cek Keselarasan Saklar Pembukaan Ujian
                if (serverMapelAktif !== userMapelPilihan) {
                    alert(`Maaf, Mata Pelajaran ${selectMapel} belum dimulai.`);
                    resetTombolLogin();
                    return;
                }

                // LANGKAH 2: Ambil Basis Data Siswa Untuk Validasi Token PIN (GET)
                const resSiswa = await fetch(`${URL_BACKEND}?action=ambilDataSiswa&id_kelas=${selectKelas}`);
                const dataSiswa = await resSiswa.json();

                if(dataSiswa.status !== "success") {
                    alert("Gagal menarik data verifikasi identitas siswa dari Cloud.");
                    resetTombolLogin();
                    return;
                }

                // COCOKKAN KREDENSIAL LOGIN
                const cocokSiswa = dataSiswa.data.find(m => 
                    m.username.toLowerCase() === userInp.toLowerCase() &&
                    m.token.toString() === tokenInp &&
                    m.status === "AKTIF"
                );

                if(!cocokSiswa) {
                    alert("Kombinasi Username Murid, PIN Token keliru, atau Akun Anda DINONAKTIFKAN!");
                    resetTombolLogin();
                    return;
                }

                // JIKA VALID: Set data sesi aplikasi internal
                stateUjian.idSiswa = cocokSiswa.id_siswa;
                stateUjian.namaLengkap = cocokSiswa.nama_lengkap;
                stateUjian.idKelas = selectKelas;
                stateUjian.mapel = userMapelPilihan;

                // LANGKAH 3: Ambil Soal Murni dari Subjek Terkait (POST)
                await dapatkanBankSoalUjian();

            } catch (err) {
                console.error(err);
                alert("Terjadi masalah interkoneksi jaringan server backend.");
                resetTombolLogin();
            }
        }

        function resetTombolLogin() {
            const btn = document.getElementById("btn-login");
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2 mt-0.5"></i> Masuk & Kerjakan Ujian';
        }

        // 3. Mengambil Bank Soal Berdasarkan Mapel Terpilih (POST - Amankan CORS)
        async function dapatkanBankSoalUjian() {
            try {
                const respon = await fetch(URL_BACKEND, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "ambilBankSoalSiswa",
                        id_kelas: stateUjian.idKelas,
                        mata_pelajaran: stateUjian.mapel
                    })
                });
                const hasil = await respon.json();

                if (hasil.status === "success" && hasil.data.length > 0) {
                    // Opsional: Jika ingin diacak urutan soalnya, hilangkan tanda komentar baris di bawah ini
                    // hasil.data.sort(() => Math.random() - 0.5);
                    
                    stateUjian.daftarSoal = hasil.data;
                    
                    // Aktifkan Tampilan Layar Ujian & Mulai Hitung Mundur
                    document.getElementById("halaman-login").classList.add("hidden");
                    document.getElementById("halaman-ujian").classList.remove("hidden");
                    
                    // Set Teks Atribut Header
                    document.getElementById("txt-display-nama").textContent = stateUjian.namaLengkap;
                    document.getElementById("txt-display-meta").textContent = `ID Murid: ${stateUjian.idSiswa} | Ujian: ${stateUjian.mapel}`;
                    
                    // Jalankan Timer & Render Soal Pertama
                    stateUjian.sisaWaktuDetik = stateUjian.durasiMenit * 60;
                    mulaiHitungMundurWaktu();
                    renderButirSoal();
                    buatKotakNavigasiNomor();
                    
                    // Rekomendasi Masuk Mode Layar Penuh Anti-Contek
                    bukaModeLayarPenuh();
                } else {
                    alert(`Bank soal untuk subjek ${stateUjian.mapel} belum tersedia pada lembar spreadsheet.`);
                    resetTombolLogin();
                }
            } catch (e) {
                console.error(e);
                alert("Eror saat mengunduh paket berkas butir bank soal.");
                resetTombolLogin();
            }
        }

        // 4. Proses Render Pertanyaan & Pilihan Opsi ke Layar Monitor Murid
        function renderButirSoal() {
            if (stateUjian.daftarSoal.length === 0) return;
            
            const soal = stateUjian.daftarSoal[stateUjian.indeksAktif];
            
            // Atur Label Atas
            document.getElementById("label-nomor-soal").textContent = `SOAL NOMOR ${stateUjian.indeksAktif + 1} DARI ${stateUjian.daftarSoal.length}`;
            document.getElementById("label-bobot-soal").textContent = `Bobot Nilai: ${soal.bobot_nilai || 1}`;
            
            // Set Gambar Jikalau Tersemat
            const boxGambar = document.getElementById("box-gambar-soal");
            const imgEl = document.getElementById("img-soal");
            if (soal.gambar && soal.gambar.toString().trim() !== "") {
                imgEl.src = soal.gambar;
                boxGambar.classList.remove("hidden");
                boxGambar.classList.add("flex");
            } else {
                boxGambar.classList.add("hidden");
                boxGambar.classList.remove("flex");
                imgEl.src = "";
            }

            // Set Isi Pertanyaan
            document.getElementById("txt-pertanyaan").innerHTML = soal.pertanyaan;

            // Render Pilihan Ganda (A, B, C, D)
            const containerPilihan = document.getElementById("container-pilihan");
            containerPilihan.innerHTML = "";

            const opsiHuruf = ["A", "B", "C", "D"];
            opsiHuruf.forEach(huruf => {
                const kolomKunci = `pilihan_${huruf.toLowerCase()}`;
                const teksOpsi = soal[kolomKunci];

                if (teksOpsi && teksOpsi.toString().trim() !== "") {
                    const isChecked = stateUjian.jawabanSiswa[soal.id_soal] === huruf;
                    
                    const divOpsi = document.createElement("div");
                    divOpsi.onclick = () => simpanPilihanJawaban(soal.id_soal, huruf);
                    divOpsi.className = `flex items-center p-3.5 border rounded-xl cursor-pointer transition-all ${isChecked ? 'bg-indigo-50 border-indigo-500 ring-1 ring-indigo-500 font-semibold' : 'bg-white border-slate-200 hover:bg-slate-50'}`;
                    
                    divOpsi.innerHTML = `
                        <div class="flex items-center justify-center w-7 h-7 rounded-lg text-xs font-bold mr-3 ${isChecked ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 border border-slate-300'}">
                            ${huruf}
                        </div>
                        <div class="text-slate-700 text-sm flex-1 leading-relaxed">${teksOpsi}</div>
                    `;
                    containerPilihan.appendChild(divOpsi);
                }
            });

            // Atur Keaktifan Tombol Next / Prev
            document.getElementById("btn-prev").disabled = (stateUjian.indeksAktif === 0);
            document.getElementById("btn-next").innerHTML = (stateUjian.indeksAktif === stateUjian.daftarSoal.length - 1) 
                ? '<i class="fa-solid fa-check-double mr-1"></i> Selesai' 
                : 'Soal Berikutnya <i class="fa-solid fa-arrow-right ml-2"></i>';
        }

        // 5. Simpan Jawaban Secara Lokal + Trigger Autosave Cloud Real-time (POST)
        function simpanPilihanJawaban(idSoal, hurufDipilih) {
            stateUjian.jawabanSiswa[idSoal] = hurufDipilih;
            
            // Refresh Komponen Tampilan Soal & Kotak Navigasi
            renderButirSoal();
            buatKotakNavigasiNomor();

            // Jalankan Fitur AUTOSAVE Latar Belakang (Anti-Listrik Padam / Force Close)
            cadangkanJawabanKeCloud("MENGERJAKAN");
        }

        // 6. Membuat Kotak Samping Kisi-Kisi Nomor Lembar Ujian
        function buatKotakNavigasiNomor() {
            const gridContainer = document.getElementById("grid-nomor");
            gridContainer.innerHTML = "";

            stateUjian.daftarSoal.forEach((soal, idx) => {
                const isTerjawab = stateUjian.jawabanSiswa[soal.id_soal] !== undefined;
                const isAktif = stateUjian.indeksAktif === idx;

                const btnNo = document.createElement("button");
                btnNo.textContent = idx + 1;
                btnNo.onclick = () => {
                    stateUjian.indeksAktif = idx;
                    renderButirSoal();
                    buatKotakNavigasiNomor();
                };

                // Styling Dinamis Atribut Kotak Nomor
                if (isAktif) {
                    btnNo.className = "py-2.5 rounded-lg text-xs font-extrabold text-white bg-indigo-600 shadow-sm border border-indigo-600 cursor-pointer";
                } else if (isTerjawab) {
                    btnNo.className = "py-2.5 rounded-lg text-xs font-bold text-white bg-emerald-500 border border-emerald-500 cursor-pointer";
                } else {
                    btnNo.className = "py-2.5 rounded-lg text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 border border-slate-200 cursor-pointer";
                }

                gridContainer.appendChild(btnNo);
            });
        }

        // 7. Pengendali Tombol Arah Navigasi Soal
        function navigasiSoal(arah) {
            const targetIndeks = stateUjian.indeksAktif + arah;
            
            if (arah === 1 && stateUjian.indeksAktif === stateUjian.daftarSoal.length - 1) {
                // Jika klik 'Selesai' di nomor terakhir
                konfirmasiSelesaiUjian();
                return;
            }

            if (targetIndeks >= 0 && targetIndeks < stateUjian.daftarSoal.length) {
                stateUjian.indeksAktif = targetIndeks;
                renderButirSoal();
                buatKotakNavigasiNomor();
            }
        }

        // 8. Hitung Mundur Jam Digital Ujian
        function mulaiHitungMundurWaktu() {
            stateUjian.timerInterval = setInterval(() => {
                if (stateUjian.sisaWaktuDetik <= 0) {
                    clearInterval(stateUjian.timerInterval);
                    alert("Waktu pengerjaan ujian Anda telah habis! Sistem mengunci lembar jawaban secara otomatis.");
                    kumpulkanJawabanFinalOtomatis();
                } else {
                    stateUjian.sisaWaktuDetik--;
                    
                    // Format output jam:menit:detik
                    const h = Math.floor(stateUjian.sisaWaktuDetik / 3600).toString().padStart(2, '0');
                    const m = Math.floor((stateUjian.sisaWaktuDetik % 3600) / 60).toString().padStart(2, '0');
                    const s = (stateUjian.sisaWaktuDetik % 60).toString().padStart(2, '0');
                    
                    document.getElementById("txt-timer").textContent = `${h}:${m}:${s}`;
                }
            }, 1000);
        }

        // 9. Sinkronisasi Data / Mengirim Payload ke Cloud (POST Aksi 6)
        function cadangkanJawabanKeCloud(statusUjian) {
            // Hitung kalkulasi skor sementara (Kunci dicocokkan otomatis di memori)
            let totalBobotBenar = 0;
            stateUjian.daftarSoal.forEach(soal => {
                const jawab = stateUjian.jawabanSiswa[soal.id_soal];
                const kunciMurni = soal.kunci_jawaban ? soal.kunci_jawaban.toString().toUpperCase().trim() : "";
                if (jawab && jawab === kunciMurni) {
                    totalBobotBenar += parseFloat(soal.bobot_nilai || 1);
                }
            });

            // Hitung nilai akhir dalam rentang standar 100%
            let nilaiMaksimum = stateUjian.daftarSoal.reduce((sum, s) => sum + parseFloat(s.bobot_nilai || 1), 0);
            let nilaiAkhir = nilaiMaksimum > 0 ? ((totalBobotBenar / nilaiMaksimum) * 100).toFixed(2) : 0;

            // Susun string rekapitulasi jawaban (Contoh: "SQL1:A, SQL2:B")
            let stringJawaban = Object.entries(stateUjian.jawabanSiswa).map(([id, hrf]) => `${id}:${hrf}`).join(", ");

            // Kirim via Fetch API POST (Bebas Batasan Kuota URL GET)
            fetch(URL_BACKEND, {
                method: "POST",
                body: JSON.stringify({
                    action: "simpanJawabanSiswa",
                    id_siswa: stateUjian.idSiswa,
                    nama_lengkap: stateUjian.namaLengkap,
                    id_kelas: stateUjian.idKelas,
                    mata_pelajaran: stateUjian.mapel,
                    daftar_jawaban: stringJawaban || "Belum Menjawab",
                    nilai_akhir: nilaiAkhir,
                    status_ujian: statusUjian // "MENGERJAKAN" atau "SELESAI"
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status !== "success") {
                    console.warn("Koneksi gagal sinkronisasi berkala:", data.message);
                }
            })
            .catch(e => console.error("Gagal melakukan autosave:", e));
        }

        // 10. Pengakhiran Sesi Ujian Manual dengan Konfirmasi
        function konfirmasiSelesaiUjian() {
            const totalSoal = stateUjian.daftarSoal.length;
            const terjawab = Object.keys(stateUjian.jawabanSiswa).length;
            const sisa = totalSoal - terjawab;

            let pesan = `Apakah Anda yakin ingin menyudahi pengerjaan ujian?\n\n` +
                        `Jumlah Soal: ${totalSoal}\n` +
                        `Sudah Diisi: ${terjawab}\n` +
                        `Sisa Kosong: ${sisa}\n\n` +
                        `Jawaban yang dikirim tidak bisa direvisi kembali.`;

            if (confirm(pesan)) {
                clearInterval(stateUjian.timerInterval);
                kumpulkanJawabanFinalOtomatis();
            }
        }

        function kumpulkanJawabanFinalOtomatis() {
            // Ubah Status ke Selesai
            cadangkanJawabanKeCloud("SELESAI");
            
            // Hapus Struktur Dokumen Layar, Ganti Notifikasi Sukses
            document.body.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4 bg-slate-100">
                    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl text-center border border-slate-200">
                        <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-emerald-100 text-emerald-600 mb-4 text-3xl">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                        <h2 class="text-2xl font-black text-slate-900">Ujian Selesai!</h2>
                        <p class="text-sm text-slate-600 mt-2 leading-relaxed">Terima kasih <b>${stateUjian.namaLengkap}</b>, seluruh berkas jawaban Anda telah dienkripsi dan berhasil disimpan dengan aman di lembar cloud server.</p>
                        <div class="mt-6 p-3.5 bg-slate-50 border border-slate-100 rounded-xl text-xs font-medium text-slate-500">
                            Mata Pelajaran: ${stateUjian.mapel} <br> Sesi Ditutup Pada: ${new Date().toLocaleTimeString()}
                        </div>
                    </div>
                </div>
            `;
            
            // Keluar dari mode fullscreen otomatis
            if (document.exitFullscreen) { document.exitFullscreen(); }
        }

        // =========================================================================
        // FITUR PENGAMAN EKSTRA (ANTI-CHEATING SYSTEM)
        // =========================================================================
        function proteksiKecurangan() {
            // 1. Blok Klik Kanan Konten
            document.addEventListener('contextmenu', e => e.preventDefault());

            // 2. Blok Pintasan Salin / Tempel / Cari Konten (Ctrl+C, Ctrl+V, Ctrl+U, F12)
            document.addEventListener('keydown', e => {
                if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'u' || e.key === 's' || e.key === 'p')) {
                    e.preventDefault();
                    alert("Fitur Dilarang: Tindakan pintasan ini dinonaktifkan demi keamanan!");
                }
                if (e.key === 'F12') {
                    e.preventDefault();
                }
            });

            // 3. Deteksi Blur Window (Siswa Membuka Tab Baru / Keluar Jendela Browser)
            window.addEventListener('blur', () => {
                if (stateUjian.idSiswa !== "") {
                    console.warn("Peringatan: Terdeteksi perpindahan tab halaman browser!");
                    // Anda bisa menambahkan penghitung pelanggaran (Pelanggaran++) jika diperlukan
                }
            });
        }

        function bukaModeLayarPenuh() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
            else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }
        }
    </script>
</body>
