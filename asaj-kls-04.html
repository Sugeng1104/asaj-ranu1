<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian ASAJ Kelas 4 - SDN Ranuklindungan I</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .emas-menyala {
            color: #fbbf24;
            text-shadow: 0 0 12px rgba(251, 191, 36, 0.9), 0 0 25px rgba(251, 191, 36, 0.6);
            font-weight: 800;
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen flex flex-col">

    <div id="login-section" class="flex-grow flex items-center justify-center p-6">
        <div class="bg-white rounded-[30px] shadow-xl shadow-slate-200/60 p-10 w-full max-w-md border border-slate-100 text-center">
            <h1 class="text-2xl font-bold text-slate-800 mb-2">Login Peserta</h1>
            <p class="text-sm text-slate-400 mb-8 font-medium tracking-wide uppercase">ASAJ Kelas 4</p>
            
            <form id="login-form" onsubmit="prosesLoginSiswa(event)" class="space-y-5 text-left">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Username</label>
                    <input type="text" id="username" required autocomplete="off" class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl font-semibold focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all" placeholder="Masukkan username">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Token / PIN</label>
                    <input type="password" id="token" required class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl font-bold tracking-[0.3em] focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all" placeholder="••••••">
                </div>
                <button type="submit" id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 transition-all active:scale-[0.98] mt-4">
                    Masuk Ruang Ujian
                </button>
            </form>
        </div>
    </div>

    <div id="exam-section" class="hidden flex-col flex-grow animate-fade-in">
        <header class="bg-white border-b border-slate-200 w-full px-8 py-4 shadow-sm">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-5">
                    <div class="w-11 h-11 rounded-full border border-blue-100 bg-blue-50 flex items-center justify-center text-blue-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>
                    <div>
                        <h1 id="display-nama" class="text-xl font-extrabold text-slate-800 uppercase tracking-tight">Memuat Nama...</h1>
                        <p class="text-[13px] text-slate-400 font-medium mt-0.5">Peserta ASAJ Kelas 4</p>
                    </div>
                </div>

                <div class="flex items-center gap-12">
                    <div class="text-center">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.15em] mb-1">ID SISWA</p>
                        <p id="display-idsiswa" class="text-sm font-bold text-slate-700 tracking-tight">-</p>
                    </div>
                    <div class="text-center">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.15em] mb-1">KELAS</p>
                        <p id="display-idkelas" class="text-sm font-bold text-slate-700 tracking-tight">-</p>
                    </div>
                    <div class="text-center bg-[#f0fdf4] px-5 py-1.5 rounded-lg border border-green-100">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.15em] mb-0.5">STATUS</p>
                        <p id="display-status" class="text-sm font-bold text-green-600 tracking-tight uppercase">-</p>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-grow flex items-center justify-center p-8">
            <div class="bg-white rounded-[40px] shadow-2xl shadow-slate-200/50 border border-slate-100 p-16 max-w-3xl w-full text-center">
                <h2 class="text-[26px] font-extrabold text-slate-800 mb-5">Simulasi Lembar Ujian Terbuka</h2>
                <p class="text-slate-400 text-base leading-relaxed mb-10 max-w-xl mx-auto font-medium">
                    Silakan jawab seluruh soal pada aplikasi lembar ujian Anda dengan teliti, kemudian klik tombol di bawah jika pengerjaan telah selesai.
                </p>
                
                <button onclick="prosesSelesaiUjian()" class="inline-flex items-center gap-3 bg-blue-600 hover:bg-blue-700 text-white font-bold px-10 py-4 rounded-2xl shadow-xl shadow-blue-200 transition-all transform hover:scale-105 active:scale-95 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                    </svg>
                    Selesai Ujian
                </button>
            </div>
        </main>
    </div>

    <div id="success-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-[40px] max-w-md w-full p-10 shadow-2xl text-center border border-slate-100">
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-50 text-green-500 mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h3 class="text-lg font-bold text-slate-700 leading-relaxed mb-6
