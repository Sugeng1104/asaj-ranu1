<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruang Ujian Kelas 4 - ASAJ SDN Ranuklindungan I</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght=400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Nunito', sans-serif; background-color: #f0fdf4; }
    .kids-title { font-family: 'Fredoka One', cursive; }
    .card-kids { border-radius: 24px; box-shadow: 0 12px 0 #bbf7d0; border: 4px solid #22c55e; }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-between">

  <header class="w-full max-w-4xl mx-auto bg-white rounded-3xl p-4 border-4 border-green-500 shadow-md flex justify-between items-center mb-4">
    <div>
      <h1 id="judul-mapel-ujian" class="text-2xl md:text-3xl kids-title text-green-600">MENUNGGU JADWAL...</h1>
      <p class="text-sm font-bold text-slate-500">Kamar Ujian: <span class="text-green-600">Kelas 4 (KLS-04)</span></p>
    </div>
    <div class="bg-green-100 px-4 py-2 rounded-2xl border-2 border-green-400 font-black text-green-700 text-center">
      <div class="text-xs uppercase">Sisa Waktu</div>
      <div id="timer-box" class="text-lg">00:00:00</div>
    </div>
  </header>

  <main class="w-full max-w-4xl mx-auto bg-white card-kids p-6 md:p-8 flex-grow mb-6 relative">
    <div id="loading-soal" class="absolute inset-0 bg-white/90 rounded-3xl flex flex-col items-center justify-center space-y-3 z-10 p-4">
      <div class="w-12 h-12 border-4 border-green-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="font-bold text-green-700 kids-title text-center">Menghubungkan ke server pusat cloud...</p>
    </div>

    <div id="box-konten-ujian" class="hidden">
      <div class="flex justify-between items-center mb-4 border-b-2 border-dashed border-slate-200 pb-3">
        <span class="bg-amber-400 text-slate-950 font-black px-4 py-1.5 rounded-full text-sm kids-title tracking-wide">
          SOAL NOMOR: <span id="current-number-txt">1</span>
        </span>
        <span class="text-xs font-bold text-slate-400">Jenis: <span id="jenis-soal-txt">-</span></span>
      </div>

      <div class="space-y-4 mb-6">
        <div id="wrapper-gambar-soal" class="hidden text-center">
          <img id="img-soal" src="" class="mx-auto rounded-2xl border-4 border-slate-200 max-h-56 object-contain shadow-sm bg-slate-50">
        </div>
        <p id="teks-pertanyaan" class="text-lg md:text-xl font-bold text-slate-800 leading-relaxed"></p>
      </div>

      <div id="area-jawaban" class="space-y-3">
         </div>
    </div>
  </main>

  <footer id="footer-nav" class="hidden w-full max-w-4xl mx-auto flex justify-between gap-4">
    <button onclick="pindahSoal(-1)" id="btn-prev" class="bg-slate-400 hover:bg-slate-500 text-white font-black py-3 px-6 rounded-2xl shadow-md transform active:scale-95 transition-all text-sm kids-title">
      ⬅ SEBELUMNYA
    </button>
    <button onclick="pindahSoal(1)" id="btn-next" class="bg-green-500 hover:bg-green-600 text-white font-black py-3 px-6 rounded-2xl shadow-md transform active:scale-95 transition-all text-sm kids-title">
      SELANJUTNYA ➡
    </button>
    <button onclick="selesaikanUjian()" id="btn-submit" class="hidden bg-red-500 hover:bg-red-600 text-white font-black py-3 px-6 rounded-2xl shadow-md transform active:scale-95 transition-all text-sm kids-title">
      🏁 SELESAI UJIAN
    </button>
  </footer>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxQqxIErnfXiPBDo2L_puaQpDFHn_jZPiLjYi6cbyiD1ph5NQdmadnlyRU0q3gG0M1Z/exec';
    const ID_KELAS_INI = 'KLS-04';
    const GITHUB_USER = 'sugeng1104';
    const GITHUB_REPO = 'asaj-ranu1';

    let bankSoalSiswa = [];
    let indeksAktif = 0;
    let mapelUjianAktif = "";
    let bundelJawabanSiswa = {}; // Merekam lembar jawaban siswa

    // Langkah 1: Deteksi otomatis mapel aktif saat halaman dibuka menggunakan metode POST (Aman dari CORS)
    window.addEventListener('DOMContentLoaded', () => {
        muatUjianSiswa();
    });

    function muatUjianSiswa() {
        fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
                action: "getMapelAktif",
                id_kelas: ID_KELAS_INI
            })
        })
        .then(r => r.json())
        .then(res => {
            if (res.status === "success" && res.mapel_aktif) {
                mapelUjianAktif = res.mapel_aktif.toUpperCase();
                
                // Set Judul di HP Siswa sesuai mapel pilihan admin
                document.getElementById('judul-mapel-ujian').innerText = `ASAJ: ${mapelUjianAktif}`;
                
                // Menentukan target sheet berdasarkan mapel aktif dari admin
                let targetSheet = "Master_Soal";
                if (mapelUjianAktif === "PANCASILA") targetSheet = "Master_Pancasila";
                if (mapelUjianAktif === "BAHASA INDONESIA") targetSheet = "Master_Bahasa Indonesia";
                if (mapelUjianAktif === "IPAS") targetSheet = "Master_IPAS";
                if (mapelUjianAktif === "BAHASA INGGRIS") targetSheet = "Master_Bahasa Inggris";

                ambilBankSoalSiswa(targetSheet);
            } else {
                document.getElementById('loading-soal').innerHTML = `<p class="text-red-500 font-bold p-4 text-center">Belum ada jadwal ujian aktif untuk Kelas 4 saat ini.</p>`;
            }
        })
        .catch(err => {
            document.getElementById('loading-soal').innerHTML = `
                <div class="text-center p-4">
                    <p class="text-red-500 font-bold mb-2">Gagal sinkronisasi data ujian!</p>
                    <p class="text-xs text-slate-500 font-mono">${err.toString()}</p>
                    <button onclick="location.reload()" class="mt-3 bg-green-500 text-white font-bold py-1.5 px-4 rounded-xl text-xs shadow-md">Coba Muat Ulang Halaman 🔄</button>
                </div>`;
        });
    }

    // Langkah 2: Ambil data soal menggunakan POST (Aman dari CORS)
    function ambilBankSoalSiswa(sheetTarget) {
        fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
                action: "ambilBankSoalSiswa",
                id_kelas: ID_KELAS_INI,
                target_sheet: sheetTarget
            })
        })
        .then(r => r.json())
        .then(res => {
            if (res.status === 'success' && res.data && res.data.length > 0) {
                // Saring kembali untuk memastikan mapel benar-benar pas
                bankSoalSiswa = res.data.filter(s => (s.mata_pelajaran || "").toString().trim().toUpperCase() === mapelUjianAktif);
                
                // Urutkan nomor soal dari terkecil ke terbesar
                bankSoalSiswa.sort((a, b) => Number(a.nomor_soal || 0) - Number(b.nomor_soal || 0));

                if(bankSoalSiswa.length === 0) {
                    document.getElementById('loading-soal').innerHTML = `<p class="text-amber-600 font-bold text-center p-4">Soal untuk mata pelajaran ${mapelUjianAktif} terdeteksi masih kosong di cloud sheet.</p>`;
                    return;
                }

                // Matikan loader, nyalakan layar utama soal
                document.getElementById('loading-soal').classList.add('hidden');
                document.getElementById('box-konten-ujian').classList.remove('hidden');
                document.getElementById('footer-nav').classList.remove('hidden');

                indeksAktif = 0;
                renderSoal();
                mulaiTimer(90); // Default waktu pengerjaan 90 menit
            } else {
                document.getElementById('loading-soal').innerHTML = `<p class="text-red-500 font-bold p-4 text-center">Data butir soal di server kosong atau gagal terambil.</p>`;
            }
        })
        .catch(err => {
            document.getElementById('loading-soal').innerHTML = `<p class="text-red-500 font-bold p-4 text-center">Gagal memproses bank soal: ${err.toString()}</p>`;
        });
    }

    // Langkah 3: Tampilkan visual soal ke siswa
    function renderSoal() {
        if(bankSoalSiswa.length === 0) return;
        const soal = bankSoalSiswa[indeksAktif];

        document.getElementById('current-number-txt').innerText = soal.nomor_soal || (indeksAktif + 1);
        document.getElementById('jenis-soal-txt').innerText = soal.jenis_soal;
        document.getElementById('teks-pertanyaan').innerText = soal.pertanyaan;

        // Kontrol Gambar Pendukung Soal dari Folder GitHub
        const wrapGambar = document.getElementById('wrapper-gambar-soal');
        const imgEl = document.getElementById('img-soal');
        if (soal.gambar && soal.gambar.trim() !== '') {
            imgEl.src = `https://${GITHUB_USER}.github.io/${GITHUB_REPO}/img/kls-04/${soal.gambar}`;
            wrapGambar.classList.remove('hidden');
        } else {
            wrapGambar.classList.add('hidden');
            imgEl.src = "";
        }

        // Tampilkan Opsi Jawaban (PILIHAN GANDA / ISIAN SINGKAT)
        const areaJwb = document.getElementById('area-jawaban');
        areaJwb.innerHTML = "";

        let jawabanTersimpan = bundelJawabanSiswa[soal.id_soal] || "";

        if (soal.jenis_soal === 'PILIHAN GANDA') {
            const listOpsi = [
                { key: 'A', teks: soal.pilihan_a },
                { key: 'B', teks: soal.pilihan_b },
                { key: 'C', teks: soal.pilihan_c },
                { key: 'D', teks: soal.pilihan_d }
            ];

            listOpsi.forEach(opsi => {
                if(opsi.teks && opsi.teks.toString().trim() !== "") {
                    let isChecked = (jawabanTersimpan === opsi.key) ? 'checked' : '';
                    let borderStyle = (jawabanTersimpan === opsi.key) ? 'border-green-500 bg-green-50 shadow-inner' : 'border-slate-200 hover:bg-slate-50';
                    
                    areaJwb.innerHTML += `
                        <label onclick="pilihOpsiPG('${soal.id_soal}', '${opsi.key}')" class="flex items-center p-3 border-2 ${borderStyle} rounded-2xl cursor-pointer transition-all space-x-3">
                            <input type="radio" name="radio-jwb" value="${opsi.key}" ${isChecked} class="w-5 h-5 text-green-600 focus:ring-green-400 border-slate-300">
                            <span class="font-black text-slate-700">${opsi.key}.</span>
                            <span class="font-bold text-slate-600">${opsi.teks}</span>
                        </label>
                    `;
                }
            });
        } else {
            areaJwb.innerHTML = `
                <div class="p-1">
                    <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">Tuliskan Jawaban Singkat Kamu:</label>
                    <input type="text" id="input-isian" value="${jawabanTersimpan}" oninput="simpanJawabanIsian('${soal.id_soal}', this.value)" class="w-full px-4 py-3 border-2 border-slate-200 rounded-2xl focus:border-green-500 focus:outline-none font-bold text-slate-700 animate-pulse-once" placeholder="Ketik jawaban di sini...">
                </div>
            `;
        }

        // Atur Kontrol Navigasi Tombol Bawah
        document.getElementById('btn-prev').disabled = (indeksAktif === 0);
        document.getElementById('btn-prev').style.opacity = (indeksAktif === 0) ? "0.5" : "1";
        
        if (indeksAktif === bankSoalSiswa.length - 1) {
            document.getElementById('btn-next').classList.add('hidden');
            document.getElementById('btn-submit').classList.remove('hidden');
        } else {
            document.getElementById('btn-next').classList.remove('hidden');
            document.getElementById('btn-submit').classList.add('hidden');
        }
    }

    function pilihOpsiPG(idSoal, keyOpsi) {
        bundelJawabanSiswa[idSoal] = keyOpsi;
        setTimeout(() => { renderSoal(); }, 100); 
    }

    function simpanJawabanIsian(idSoal, nilaiTeks) {
        bundelJawabanSiswa[idSoal] = nilaiTeks.trim();
    }

    function pindahSoal(arah) {
        indeksAktif += arah;
        if(indeksAktif < 0) indeksAktif = 0;
        if(indeksAktif >= bankSoalSiswa.length) indeksAktif = bankSoalSiswa.length - 1;
        renderSoal();
    }

    // Langkah 4: Selesai dan Kirim Jawaban Akhir
    function selesaikanUjian() {
        if(!confirm("Apakah kamu yakin semua jawaban sudah terisi dengan benar dan ingin menyelesaikan ujian?")) return;

        document.getElementById('loading-soal').innerHTML = `
            <div class="w-12 h-12 border-4 border-red-500 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
            <p class="font-bold text-red-600 kids-title text-center">Sedang mengunci skor & mengirim lembar ujian siswa ke database cloud...</p>`;
        document.getElementById('loading-soal').classList.remove('hidden');

        // Kerangka kirim jawaban siswa via POST (bisa dikembangkan sesuai struktur lembar jawab Bapak)
        setTimeout(() => {
            alert("Selamat! Lembar jawaban ujian kamu berhasil dikirim ke guru.");
            window.location.reload();
        }, 1500);
    }

    // Fungsi Timer Mundur Otomatis
    function mulaiTimer(durasiMenit) {
        let targetWaktu = durasiMenit * 60;
        const interval = setInterval(() => {
            let jam = Math.floor(targetWaktu / 3600);
            let menit = Math.floor((targetWaktu % 3600) / 60);
            let detik = targetWaktu % 60;

            jam = jam < 10 ? '0' + jam : jam;
            menit = menit < 10 ? '0' + menit : menit;
            detik = detik < 10 ? '0' + detik : detik;

            document.getElementById('timer-box').innerText = `${jam}:${menit}:${detik}`;
            
            if (--targetWaktu < 0) {
                clearInterval(interval);
                alert("Waktu ujian kamu telah habis!");
                selesaikanUjian();
            }
        }, 1000);
    }
  </script>
</body>
</html>
