<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - ASAJ SDN Ranuklindungan I</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body{
      font-family:'Nunito',sans-serif;
      background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);
      color:#fff;
    }

    .font-kids-title{
      font-family:'Fredoka One',cursive;
    }

    .card{
      background:#1e293b;
      border:1px solid #334155;
      color:#fff;
      border-radius:20px;
    }

    .form-control,
    .form-select{
      background:#0f172a;
      border:1px solid #334155;
      color:#fff;
    }

    .form-control:focus,
    .form-select:focus{
      background:#1e293b;
      border-color:#3b82f6;
      color:#fff;
      box-shadow:none;
    }

    .table-dark{
      --bs-table-bg:#0f172a;
    }

    .nav-tabs{
      border-bottom:1px solid #334155;
    }

    .nav-tabs .nav-link{
      color:#94a3b8;
      border:none;
      font-weight:bold;
    }

    .nav-tabs .nav-link.active{
      background:#1e293b;
      color:#3b82f6;
      border:1px solid #334155;
      border-bottom:none;
    }

    .btn-custom{
      border:none;
      font-weight:bold;
      border-radius:12px;
    }

    .img-thumb{
      max-height:70px;
      object-fit:contain;
    }

    .loader-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.7);
      z-index:9999;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:10px;
      backdrop-filter:blur(5px);
    }
  </style>
</head>

<body class="p-4">

<div id="loader-halaman" class="loader-overlay hidden">
  <div class="spinner-border text-info"></div>
  <div class="fw-bold">
    Memproses data ke server cloud...
  </div>
</div>

<div class="container-fluid">

  <div class="card p-4 mb-4">

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

      <div>
        <h1 class="font-kids-title text-info mb-1">
          ADMIN ASAJ
        </h1>

        <div id="txtDetailKelas" class="text-secondary">
          Dashboard Bank Soal
        </div>
      </div>

      <button onclick="logoutAdmin()"
        class="btn btn-danger btn-custom">
        Logout
      </button>

    </div>

  </div>

  <ul class="nav nav-tabs mb-4">

    <li class="nav-item">
      <button class="nav-link active"
        data-bs-toggle="tab"
        data-bs-target="#soal-panel">

        <i class="fa-solid fa-book text-primary"></i>
        Bank Soal

      </button>
    </li>

    <li class="nav-item">
      <button class="nav-link"
        data-bs-toggle="tab"
        data-bs-target="#nilai-panel"
        onclick="muatRekapNilai()">

        <i class="fa-solid fa-square-poll-vertical text-success"></i>
        Rekap Nilai

      </button>
    </li>

  </ul>

  <div class="tab-content">

    <!-- PANEL SOAL -->
    <div class="tab-pane fade show active" id="soal-panel">

      <div class="row">

        <!-- KIRI -->
        <div class="col-lg-4">

          <!-- KONTROL SESI -->
          <div class="card p-4 mb-4">

            <h4 class="text-info fw-bold mb-3">
              <i class="fa-solid fa-toggle-on"></i>
              Kontrol Sesi Ujian
            </h4>

            <div class="bg-dark rounded-4 p-3 border border-secondary">

              <div class="small text-secondary">
                Status Saat Ini:
              </div>

              <div id="txtMapelAktifSekarang"
                class="fw-bold text-warning mb-3">

                Memuat...

              </div>

              <label class="small mb-1">
                Setel Mapel Aktif
              </label>

              <select id="saklarMapelPilihan"
                class="form-select mb-3">

                <option value="MATEMATIKA">MATEMATIKA</option>
                <option value="PANCASILA">PANCASILA</option>
                <option value="BAHASA INDONESIA">BAHASA INDONESIA</option>
                <option value="IPAS">IPAS</option>
                <option value="BAHASA INGGRIS">BAHASA INGGRIS</option>

              </select>

              <button onclick="setelMapelAktifServer()"
                class="btn btn-info w-100 fw-bold text-dark btn-custom">

                <i class="fa-solid fa-power-off"></i>
                Aktifkan Ujian

              </button>

            </div>

          </div>

          <!-- INPUT SOAL -->
          <div class="card p-4 mb-4">

            <h4 class="text-primary fw-bold mb-3">
              <i class="fa-solid fa-folder-plus"></i>
              Kelola Bank Soal
            </h4>

            <div class="bg-dark rounded-4 p-3 mb-3 border border-secondary">

              <label class="small fw-bold text-warning mb-2">
                Upload Massal Excel
              </label>

              <input type="file"
                id="excelSoalInput"
                class="form-control mb-2"
                accept=".xlsx,.xls">

              <button onclick="bacaExcelSoal()"
                class="btn btn-warning w-100 fw-bold text-dark btn-custom mb-2">

                Baca Excel

              </button>

              <button id="btnSimpanSoalMassal"
                onclick="kirimSoalMassal()"
                class="btn btn-success w-100 fw-bold btn-custom"
                disabled>

                Simpan Soal Massal

              </button>

            </div>

            <div class="text-center text-secondary small mb-3">
              INPUT MANUAL
            </div>

            <form id="formSoalTunggal"
              onsubmit="simpanSoalTunggal(event)">

              <div class="mb-2">
                <label class="small mb-1">Nomor Soal</label>
                <input type="number"
                  id="soalNomor"
                  class="form-control"
                  required>
              </div>

              <div class="mb-2">
                <label class="small mb-1">Mata Pelajaran</label>

                <select id="soalMapel"
                  class="form-select"
                  required>

                  <option value="">Pilih Mapel</option>
                  <option value="MATEMATIKA">MATEMATIKA</option>
                  <option value="PANCASILA">PANCASILA</option>
                  <option value="BAHASA INDONESIA">BAHASA INDONESIA</option>
                  <option value="IPAS">IPAS</option>
                  <option value="BAHASA INGGRIS">BAHASA INGGRIS</option>

                </select>
              </div>

              <div class="mb-2">
                <label class="small mb-1">Jenis Soal</label>

                <select id="soalJenis"
                  class="form-select"
                  onchange="aturFormPilihan()">

                  <option value="PILIHAN GANDA">
                    PILIHAN GANDA
                  </option>

                  <option value="ISIAN SINGKAT">
                    ISIAN SINGKAT
                  </option>

                </select>
              </div>

              <div class="mb-2">
                <label class="small mb-1">Pertanyaan</label>

                <textarea id="soalPertanyaan"
                  class="form-control"
                  rows="3"
                  required></textarea>
              </div>

              <div id="containerOpsiPG">

                <div class="mb-2">
                  <label class="small mb-1">Pilihan A</label>
                  <input type="text" id="soalOpsiA" class="form-control">
                </div>

                <div class="mb-2">
                  <label class="small mb-1">Pilihan B</label>
                  <input type="text" id="soalOpsiB" class="form-control">
                </div>

                <div class="mb-2">
                  <label class="small mb-1">Pilihan C</label>
                  <input type="text" id="soalOpsiC" class="form-control">
                </div>

                <div class="mb-2">
                  <label class="small mb-1">Pilihan D</label>
                  <input type="text" id="soalOpsiD" class="form-control">
                </div>

              </div>

              <div class="mb-2">
                <label class="small mb-1">Kunci Jawaban</label>
                <input type="text"
                  id="soalKunci"
                  class="form-control"
                  required>
              </div>

              <div class="mb-3">
                <label class="small mb-1">Bobot</label>
                <input type="number"
                  id="soalBobot"
                  class="form-control"
                  value="1">
              </div>

              <button type="submit"
                class="btn btn-primary w-100 fw-bold btn-custom">

                Simpan Soal

              </button>

            </form>

          </div>

        </div>

        <!-- KANAN -->
        <div class="col-lg-8">

          <div class="card p-4">

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">

              <h4 class="fw-bold mb-0">

                <i class="fa-solid fa-database text-success"></i>
                Database Soal

              </h4>

              <div class="d-flex gap-2">

                <select id="pilihMapelDatabase"
                  class="form-select fw-bold"
                  style="background:#FFB703;color:#000;">

                  <option value="MATEMATIKA">MATEMATIKA</option>
                  <option value="PANCASILA">PANCASILA</option>
                  <option value="BAHASA INDONESIA">BAHASA INDONESIA</option>
                  <option value="IPAS">IPAS</option>
                  <option value="BAHASA INGGRIS">BAHASA INGGRIS</option>

                </select>

                <button onclick="muatBankSoal()"
                  class="btn btn-primary fw-bold btn-custom">

                  Buka Soal

                </button>

              </div>

            </div>

            <div class="table-responsive">

              <table class="table table-dark table-striped table-bordered align-middle">

                <thead>

                <tr>

                  <th>No</th>
                  <th>ID Soal</th>
                  <th>Jenis</th>
                  <th>Pertanyaan</th>
                  <th>Kunci</th>
                  <th>Bobot</th>
                  <th>Gambar</th>

                </tr>

                </thead>

                <tbody id="tabelSoalBody">

                <tr>
                  <td colspan="7"
                    class="text-center text-secondary">

                    Belum ada data dimuat

                  </td>
                </tr>

                </tbody>

              </table>

            </div>

          </div>

        </div>

      </div>

    </div>

    <!-- PANEL NILAI -->
    <div class="tab-pane fade" id="nilai-panel">

      <div class="card p-4">

        <h4 class="fw-bold mb-3">
          Rekap Nilai
        </h4>

        <div class="table-responsive">

          <table class="table table-dark table-bordered table-striped">

            <thead>
            <tr>
              <th>Waktu</th>
              <th>ID Siswa</th>
              <th>Nama</th>
              <th>Mapel</th>
              <th>Nilai</th>
              <th>Status</th>
            </tr>
            </thead>

            <tbody id="tabelNilaiBody">

            <tr>
              <td colspan="6"
                class="text-center text-secondary">

                Belum ada data

              </td>
            </tr>

            </tbody>

          </table>

        </div>

      </div>

    </div>

  </div>

</div>

<input type="file"
  id="inputFileGambarDinamis"
  class="d-none"
  accept="image/*"
  onchange="prosesUnggahGambarDinamis(this)">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

const API_URL = 'PASTE_URL_APPS_SCRIPT_DISINI';

const MAPEL_SHEET = {
  "MATEMATIKA":"Master_Soal",
  "PANCASILA":"Master_Pancasila",
  "BAHASA INDONESIA":"Master_Bahasa Indonesia",
  "IPAS":"Master_IPAS",
  "BAHASA INGGRIS":"Master_Bahasa Inggris"
};

let kelasAktifGlobal = {
  id:"KLS-04",
  nama:"Kelas 4"
};

let dataSoalMassalTerbaca = [];

let targetUploadGambar = {
  idSoal:'',
  sheetName:''
};

function showLoader(){
  document.getElementById('loader-halaman').classList.remove('hidden');
}

function hideLoader(){
  document.getElementById('loader-halaman').classList.add('hidden');
}

function logoutAdmin(){
  localStorage.removeItem('asaj_admin_session');
  location.reload();
}

function aturFormPilihan(){

  const jenis = document.getElementById('soalJenis').value;

  document.getElementById('containerOpsiPG').style.display =
    jenis === 'ISIAN SINGKAT'
    ? 'none'
    : 'block';
}

function cekSaklarMapelAktif(){

  fetch(API_URL,{
    method:'POST',
    body:JSON.stringify({
      action:'getMapelAktif',
      id_kelas:kelasAktifGlobal.id
    })
  })

  .then(r=>r.json())

  .then(res=>{

    if(res.mapel_aktif){

      document.getElementById('txtMapelAktifSekarang').innerHTML = `
        <i class="fa-solid fa-circle text-success"></i>
        ${res.mapel_aktif}
      `;

    }else{

      document.getElementById('txtMapelAktifSekarang').innerHTML = `
        <i class="fa-solid fa-circle text-danger"></i>
        Belum ada ujian aktif
      `;
    }

  });
}

function setelMapelAktifServer(){

  const mapel =
    document.getElementById('saklarMapelPilihan').value;

  showLoader();

  fetch(API_URL,{
    method:'POST',
    body:JSON.stringify({
      action:'setMapelAktif',
      id_kelas:kelasAktifGlobal.id,
      mata_pelajaran:mapel
    })
  })

  .then(r=>r.json())

  .then(res=>{
    alert(res.message);
    cekSaklarMapelAktif();
  })

  .finally(()=>{
    hideLoader();
  });
}

function bacaExcelSoal(){

  const fileInput =
    document.getElementById('excelSoalInput');

  if(!fileInput.files.length){
    return alert('Pilih file excel!');
  }

  const file = fileInput.files[0];

  const reader = new FileReader();

  reader.onload = function(e){

    const data = new Uint8Array(e.target.result);

    const workbook =
      XLSX.read(data,{type:'array'});

    const sheet =
      workbook.Sheets[workbook.SheetNames[0]];

    const json =
      XLSX.utils.sheet_to_json(sheet);

    dataSoalMassalTerbaca = json;

    alert(`Berhasil membaca ${json.length} soal`);

    document.getElementById(
      'btnSimpanSoalMassal'
    ).disabled = false;
  };

  reader.readAsArrayBuffer(file);
}

function kirimSoalMassal(){

  const mapel =
    document.getElementById('soalMapel').value;

  if(!mapel){
    return alert('Pilih mapel!');
  }

  const namaSheet =
    MAPEL_SHEET[mapel] || 'Master_Soal';

  showLoader();

  fetch(API_URL,{
    method:'POST',
    body:JSON.stringify({
      action:'simpanSoalMassal',
      id_kelas:kelasAktifGlobal.id,
      mata_pelajaran:mapel,
      sheet:namaSheet,
      data_soal:dataSoalMassalTerbaca
    })
  })

  .then(r=>r.json())

  .then(res=>{
    alert(res.message);
    muatBankSoal();
  })

  .finally(()=>{
    hideLoader();
  });
}

function simpanSoalTunggal(e){

  e.preventDefault();

  const mapel =
    document.getElementById('soalMapel').value;

  const sheet =
    MAPEL_SHEET[mapel] || 'Master_Soal';

  const payload = {

    action:'simpanSoalManual',

    sheet:sheet,

    id_kelas:kelasAktifGlobal.id,

    nomor_soal:
      document.getElementById('soalNomor').value,

    mata_pelajaran:mapel,

    jenis_soal:
      document.getElementById('soalJenis').value,

    pertanyaan:
      document.getElementById('soalPertanyaan').value,

    pilihan_a:
      document.getElementById('soalOpsiA').value,

    pilihan_b:
      document.getElementById('soalOpsiB').value,

    pilihan_c:
      document.getElementById('soalOpsiC').value,

    pilihan_d:
      document.getElementById('soalOpsiD').value,

    kunci_jawaban:
      document.getElementById('soalKunci').value,

    bobot_nilai:
      document.getElementById('soalBobot').value
  };

  showLoader();

  fetch(API_URL,{
    method:'POST',
    body:JSON.stringify(payload)
  })

  .then(r=>r.json())

  .then(res=>{

    alert(res.message);

    document.getElementById(
      'formSoalTunggal'
    ).reset();

    muatBankSoal();

  })

  .finally(()=>{
    hideLoader();
  });
}

function muatBankSoal(){

  const mapel =
    document.getElementById(
      'pilihMapelDatabase'
    ).value;

  const namaSheet =
    MAPEL_SHEET[mapel] || 'Master_Soal';

  const tbody =
    document.getElementById(
      'tabelSoalBody'
    );

  tbody.innerHTML = `
    <tr>
      <td colspan="7"
        class="text-center text-info">

        Memuat bank soal...

      </td>
    </tr>
  `;

  fetch(
    `${API_URL}?action=ambilBankSoal&id_kelas=${kelasAktifGlobal.id}&sheet=${encodeURIComponent(namaSheet)}&mapel=${encodeURIComponent(mapel)}`
  )

  .then(r=>r.json())

  .then(res=>{

    if(res.status === 'success'
      && res.data.length > 0){

      tbody.innerHTML = '';

      res.data.forEach((soal,index)=>{

        let opsiHtml = '';

        if(soal.jenis_soal === 'PILIHAN GANDA'){

          opsiHtml = `
            <div class="small text-secondary mt-2">
              A. ${soal.pilihan_a || '-'}<br>
              B. ${soal.pilihan_b || '-'}<br>
              C. ${soal.pilihan_c || '-'}<br>
              D. ${soal.pilihan_d || '-'}
            </div>
          `;
        }

        let gambarHtml = `
          <div class="small text-secondary">
            Tidak ada gambar
          </div>
        `;

        if(soal.gambar){

          gambarHtml = `
            <img src="${soal.gambar}"
              class="img-thumbnail img-thumb">
          `;
        }

        tbody.innerHTML += `
          <tr>

            <td class="text-warning fw-bold text-center">
              ${soal.nomor_soal || index+1}
            </td>

            <td>
              <code>${soal.id_soal}</code>
            </td>

            <td>
              <span class="badge bg-primary">
                ${soal.jenis_soal}
              </span>
            </td>

            <td>
              <div class="fw-bold">
                ${soal.pertanyaan}
              </div>

              ${opsiHtml}
            </td>

            <td class="text-warning fw-bold">
              ${soal.kunci_jawaban}
            </td>

            <td class="text-center">
              ${soal.bobot_nilai}
            </td>

            <td>

              <div class="d-flex flex-column align-items-center gap-2">

                ${gambarHtml}

                <button
                  class="btn btn-info btn-sm fw-bold"
                  onclick="unggahGambarSoal('${soal.id_soal}','${namaSheet}')">

                  Upload

                </button>

              </div>

            </td>

          </tr>
        `;
      });

    }else{

      tbody.innerHTML = `
        <tr>
          <td colspan="7"
            class="text-center text-secondary">

            Tidak ada soal ditemukan

          </td>
        </tr>
      `;
    }

  })

  .catch(()=>{

    tbody.innerHTML = `
      <tr>
        <td colspan="7"
          class="text-center text-danger">

          Gagal memuat data

        </td>
      </tr>
    `;
  });
}

function unggahGambarSoal(idSoal,namaSheet){

  targetUploadGambar.idSoal = idSoal;

  targetUploadGambar.sheetName = namaSheet;

  document.getElementById(
    'inputFileGambarDinamis'
  ).click();
}

function prosesUnggahGambarDinamis(input){

  if(!input.files.length) return;

  const file = input.files[0];

  const reader = new FileReader();

  reader.onload = function(e){

    const base64 =
      e.target.result.split(',')[1];

    showLoader();

    fetch(API_URL,{
      method:'POST',
      body:JSON.stringify({
        action:'unggahGambarSoal',
        id_soal:targetUploadGambar.idSoal,
        sheet:targetUploadGambar.sheetName,
        nama_file:file.name,
        tipe_file:file.type,
        berkas_base64:base64
      })
    })

    .then(r=>r.json())

    .then(res=>{
      alert(res.message);
      muatBankSoal();
    })

    .finally(()=>{
      hideLoader();
    });
  };

  reader.readAsDataURL(file);
}

function muatRekapNilai(){

  fetch(
    `${API_URL}?action=ambilRekapNilai&id_kelas=${kelasAktifGlobal.id}`
  )

  .then(r=>r.json())

  .then(res=>{

    const tbody =
      document.getElementById(
        'tabelNilaiBody'
      );

    if(res.status === 'success'
      && res.data.length > 0){

      tbody.innerHTML = '';

      res.data.forEach(n=>{

        tbody.innerHTML += `
          <tr>

            <td>${n.waktu_selesai}</td>

            <td>
              <code>${n.id_siswa}</code>
            </td>

            <td>${n.nama_lengkap}</td>

            <td>
              <span class="badge bg-info">
                ${n.mata_pelajaran}
              </span>
            </td>

            <td class="fw-bold text-success">
              ${n.nilai_akhir}
            </td>

            <td>
              <span class="badge bg-primary">
                ${n.status_pengerjaan}
              </span>
            </td>

          </tr>
        `;
      });

    }else{

      tbody.innerHTML = `
        <tr>
          <td colspan="6"
            class="text-center text-secondary">

            Belum ada nilai

          </td>
        </tr>
      `;
    }

  });
}

cekSaklarMapelAktif();

</script>

</body>
</html>
