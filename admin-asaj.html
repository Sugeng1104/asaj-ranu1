<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin Ujian Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* Custom styles jika diperlukan */
        .hidden { display: none; }
        .animate-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">

    <div id="loader-halaman" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 hidden">
        <div class="text-center">
            <i class="fa-solid fa-circle-notch animate-spin text-4xl text-amber-500 mb-2"></i>
            <p>Memproses data ke cloud...</p>
        </div>
    </div>

    <input type="file" id="inputFileGambarDinamis" accept="image/*" class="hidden" onchange="prosesUnggahGambarDinamis(this)">

    <script>
        // Konfigurasi Global Environment (Sesuaikan dengan milik Anda)
        const API_URL = "URL_WEB_APP_APPS_SCRIPT_ANDA_DISINI"; 
        const GITHUB_USER = "USERNAME_GITHUB_ANDA";
        const GITHUB_REPO = "NAMA_REPOSITORY_ANDA";

        let kelasAktifGlobal = { id: "", nama: "" };
        let dataSiswaMassalTerbaca = [];
        let dataSoalMassalTerbaca = [];
        let targetUploadGambar = { idSoal: "", sheetName: "" };

        // ==========================================
        // BAGIAN 1: MANAJEMEN PESERTA / SISWA
        // ==========================================

        function bacaExcelPeserta() {
            const fileInput = document.getElementById('excelPesertaInput');
            if(!fileInput.files || fileInput.files.length === 0) return alert("Pilih file excel!");
            
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const arrBuffer = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(arrBuffer, {type: 'array'});
                    const sheetJson = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    
                    if(sheetJson.length === 0 || !sheetJson[0].hasOwnProperty('nama_lengkap')) {
                        return alert("Format salah! Kolom wajib di Excel baris pertama harus bernama 'nama_lengkap'.");
                    }

                    dataSiswaMassalTerbaca = sheetJson;
                    const tbody = document.getElementById('tabelPesertaBody');
                    tbody.innerHTML = "";
                    sheetJson.forEach(siswa => {
                        tbody.innerHTML += `<tr>
                            <td>[PROSES]</td>
                            <td>${siswa.nama_lengkap.toUpperCase()}</td>
                            <td>[OTOMATIS]</td>
                            <td>[OTOMATIS]</td>
                            <td><span class="badge bg-warning text-dark">READY</span></td>
                        </tr>`;
                    });
                    document.getElementById('btnSimpanPeserta').disabled = false;
                } catch(err) {
                    alert("Gagal membaca file excel: " + err.toString());
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function kirimPesertaMassal() {
            if(dataSiswaMassalTerbaca.length === 0) return;
            document.getElementById('loader-halaman').classList.remove('hidden');
            
            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'simpanSiswaMassal',
                    id_kelas: kelasAktifGlobal.id,
                    data_siswa: dataSiswaMassalTerbaca
                })
            })
            .then(res => res.json())
            .then(res => {
                alert(res.message);
                document.getElementById('excelPesertaInput').value = "";
                document.getElementById('btnSimpanPeserta').disabled = true;
                muatDataSiswaEksisting();
            })
            .catch(() => alert("Koneksi gagal saat menyimpan siswa."))
            .finally(() => document.getElementById('loader-halaman').classList.add('hidden'));
        }

        function muatDataSiswaEksisting() {
            const tbody = document.getElementById('tabelPesertaBody');
            if(!tbody) return;
            tbody.innerHTML = `<tr><td colspan="5" class="text-center"><i class="fa-solid fa-spinner animate-spin"></i> Menarik data siswa cloud...</td></tr>`;
            
            fetch(`${API_URL}?action=ambilDataSiswa&id_kelas=${encodeURIComponent(kelasAktifGlobal.id)}`)
            .then(res => res.json())
            .then(res => {
                if(res.status === 'success' && res.data.length > 0) {
                    tbody.innerHTML = "";
                    res.data.forEach(siswa => {
                        tbody.innerHTML += `<tr>
                            <td class="font-mono text-xs text-blue-400">${siswa.id_siswa}</td>
                            <td class="fw-bold">${siswa.nama_lengkap}</td>
                            <td class="text-warning">${siswa.username}</td>
                            <td class="font-mono text-green-400 fw-bold">${siswa.token}</td>
                            <td><span class="badge bg-success">${siswa.status}</span></td>
                        </tr>`;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">Belum ada siswa di kelas ini. Silahkan impor Excel.</td></tr>`;
                }
            })
            .catch(() => {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger">Gagal sinkronisasi data peserta.</td></tr>`;
            });
        }

        // ==========================================
        // BAGIAN 2: MANAJEMEN BANK SOAL
        // ==========================================

        function aturFormPilihan() {
            const jenis = document.getElementById('soalJenis').value;
            const container = document.getElementById('containerOpsiPG');
            if(!container) return;
            if(jenis === 'ISIAN SINGKAT') {
                container.classList.add('hidden');
            } else {
                container.classList.remove('hidden');
            }
        }

        function bacaExcelSoal() {
            const fileInput = document.getElementById('excelSoalInput');
            if(!fileInput.files || fileInput.files.length === 0) return alert("Pilih file excel!");
            
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const arrBuffer = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(arrBuffer, {type: 'array'});
                    const sheetJson = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    
                    if(sheetJson.length === 0 || !sheetJson[0].hasOwnProperty('pertanyaan') || !sheetJson[0].hasOwnProperty('mata_pelajaran')) {
                        return alert("Format salah! Wajib memiliki kolom 'mata_pelajaran' dan 'pertanyaan'.");
                    }
                    
                    dataSoalMassalTerbaca = sheetJson;
                    document.getElementById('btnSimpanSoalMassal').disabled = false;
                    alert(`Terdeteksi ${sheetJson.length} butir soal siap impor.`);
                } catch(err) {
                    alert("Gagal memproses file excel bank soal: " + err.toString());
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function kirimSoalMassal() {
            if(dataSoalMassalTerbaca.length === 0) return;
            document.getElementById('loader-halaman').classList.remove('hidden');
            
            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'simpanSoalMassal',
                    id_kelas: kelasAktifGlobal.id,
                    data_soal: dataSoalMassalTerbaca
                })
            })
            .then(res => res.json())
            .then(res => {
                alert(res.message);
                document.getElementById('excelSoalInput').value = "";
                document.getElementById('btnSimpanSoalMassal').disabled = true;
                muatBankSoal();
            })
            .catch(() => alert("Gagal menyimpan bank soal massal."))
            .finally(() => document.getElementById('loader-halaman').classList.add('hidden'));
        }

        function simpanSoalTunggal(e) {
            e.preventDefault();
            document.getElementById('loader-halaman').classList.remove('hidden');
            
            const payload = {
                action: 'tambahSoalTunggal',
                data_soal: {
                    id_kelas: kelasAktifGlobal.id,
                    nomor_soal: document.getElementById('soalNomor').value,
                    mata_pelajaran: document.getElementById('soalMapel').value,
                    jenis_soal: document.getElementById('soalJenis').value,
                    pertanyaan: document.getElementById('soalPertanyaan').value,
                    pilihan_a: document.getElementById('soalOpsiA').value,
                    pilihan_b: document.getElementById('soalOpsiB').value,
                    pilihan_c: document.getElementById('soalOpsiC').value,
                    pilihan_d: document.getElementById('soalOpsiD').value,
                    kunci_jawaban: document.getElementById('soalKunci').value,
                    bobot_nilai: document.getElementById('soalBobot').value,
                    gambar: ''
                }
            };

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                alert(res.message);
                document.getElementById('formSoalTunggal').reset();
                aturFormPilihan();
                muatBankSoal();
            })
            .catch(() => alert("Gagal menyimpan soal manual."))
            .finally(() => document.getElementById('loader-halaman').classList.add('hidden'));
        }

        function muatBankSoal() {
            const mapelElement = document.getElementById('pilihMapelDatabase');
            if(!mapelElement) return;
            const mapel = mapelElement.value;
            const tbody = document.getElementById('tabelSoalBody');
            if(!tbody) return;
            
            tbody.innerHTML = `<tr><td colspan="7" class="text-center"><i class="fa-solid fa-spinner animate-spin"></i> Membaca tabel Master_${mapel}...</td></tr>`;
            
            fetch(`${API_URL}?action=ambilBankSoal&mata_pelajaran=${encodeURIComponent(mapel)}&id_kelas=${encodeURIComponent(kelasAktifGlobal.id)}`)
            .then(res => res.json())
            .then(res => {
                if(res.status === 'success' && res.data.length > 0) {
                    tbody.innerHTML = "";
                    res.data.forEach(soal => {
                        let opsiHtml = "";
                        if(soal.jenis_soal === 'PILIHAN GANDA') {
                            opsiHtml = `<div class="mt-1 text-slate-400">
                                A. ${soal.pilihan_a}<br>B. ${soal.pilihan_b}<br>C. ${soal.pilihan_c}<br>D. ${soal.pilihan_d}
                            </div>`;
                        }
                        
                        let imageSection = "";
                        if(soal.gambar && soal.gambar.trim() !== "") {
                            let linkGambarReal = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/assets/img/${soal.gambar}`;
                            imageSection = `<div class="mb-2"><img src="${linkGambarReal}" class="rounded border border-slate-600 max-h-24 mx-auto"></div>
                                            <button class="btn btn-dark btn-xs text-xs font-bold px-2 py-1 text-warning bg-slate-800 rounded border border-slate-700" onclick="pemicuKlikUploadGambar('${soal.id_soal}', '${mapel}')">🔄 Ganti Gambar</button>`;
                        } else {
                            imageSection = `<button class="btn btn-outline-dashed border-secondary btn-sm text-xs py-1 px-2 border border-dashed border-slate-600 rounded text-slate-400 hover:text-white" onclick="pemicuKlikUploadGambar('${soal.id_soal}', '${mapel}')">➕ Unggah Gambar</button>`;
                        }

                        tbody.innerHTML += `<tr>
                            <td class="text-center fw-bold text-amber-400">${soal.nomor_soal}</td>
                            <td class="font-mono text-xs text-slate-400">${soal.id_soal}</td>
                            <td class="text-center"><span class="badge bg-slate-700 text-xs px-2 py-0.5 rounded">${soal.jenis_soal}</span></td>
                            <td>
                                <div class="fw-semibold text-white">${soal.pertanyaan}</div>
                                ${opsiHtml}
                            </td>
                            <td class="text-center fw-bold text-success">${soal.kunci_jawaban}</td>
                            <td class="text-center font-mono">${soal.bobot_nilai}</td>
                            <td class="text-center">${imageSection}</td>
                        </tr>`;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">Belum ada bank soal terpasang untuk mapel ${mapel}.</td></tr>`;
                }
            })
            .catch(() => {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">Gagal memuat database bank soal dari cloud server.</td></tr>`;
            });
        }

        function pemicuKlikUploadGambar(idSoal, mapel) {
            targetUploadGambar = { idSoal: idSoal, sheetName: mapel };
            document.getElementById('inputFileGambarDinamis').click();
        }

        function prosesUnggahGambarDinamis(el) {
            if(!el.files || el.files.length === 0) return;
            const file = el.files[0];
            
            const namaGambarBaru = `img-${targetUploadGambar.idSoal}-${new Date().getTime()}.${file.name.split('.').pop()}`;
            document.getElementById('loader-halaman').classList.remove('hidden');
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const rawBase64 = e.target.result.split(',')[1];
                
                fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'proxyUploadGithub',
                        path: `assets/img/${namaGambarBaru}`,
                        content: rawBase64,
                        id_soal: targetUploadGambar.idSoal,
                        mata_pelajaran: targetUploadGambar.sheetName,
                        nama_gambar: namaGambarBaru
                    })
                })
                .then(res => res.json())
                .then(res => {
                    alert(res.message);
                    muatBankSoal();
                })
                .catch(() => alert("Gagal mengirim data gambar ke proxy cloud."))
                .finally(() => {
                    document.getElementById('loader-halaman').classList.add('hidden');
                    el.value = "";
                });
            };
            reader.readAsDataURL(file);
        }

        // ==========================================
        // BAGIAN 3: REKAP NILAI UJIAN
        // ==========================================

        function muatRekapNilai() {
            const tbody = document.getElementById('tabelNilaiBody');
            if(!tbody) return;
            tbody.innerHTML = `<tr><td colspan="6" class="text-center"><i class="fa-solid fa-spinner animate-spin"></i> Mengunduh lembar rekap nilai...</td></tr>`;
            
            fetch(`${API_URL}?action=ambilRekapNilai&id_kelas=${encodeURIComponent(kelasAktifGlobal.id)}`)
            .then(res => res.json())
            .then(res => {
                if(res.status === 'success' && res.data.length > 0) {
                    tbody.innerHTML = "";
                    res.data.forEach(item => {
                        let tgl = new Date(item.timestamp).toLocaleString('id-ID');
                        tbody.innerHTML += `<tr>
                            <td class="text-slate-400 text-xs">${tgl}</td>
                            <td class="font-mono text-xs">${item.id_siswa}</td>
                            <td class="fw-bold text-white">${item.nama_lengkap}</td>
                            <td class="text-warning fw-bold text-xs">${item.mata_pelajaran}</td>
                            <td class="text-center fw-bold text-blue-400">${item.nilai_akhir}</td>
                            <td><span class="badge bg-success text-xs px-2 py-0.5 rounded">SELESAI</span></td>
                        </tr>`;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">Belum ada siswa yang menyelesaikan ujian di kelas ini.</td></tr>`;
                }
            })
            .catch(() => {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger">Gagal memuat rekap nilai.</td></tr>`;
            });
        }

        // ==========================================
        // BAGIAN 4: MANAGEMENT KELAS & NAVIGASI TAB
        // ==========================================

        function gantiTabMenu(targetTabId, elemenMenu) {
            // Sembunyikan semua section kontainer utama
            const semuaSection = ['konten-dashboard', 'konten-peserta', 'konten-soal', 'konten-nilai'];
            semuaSection.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });

            // Tampilkan section yang dipilih
            const targetEl = document.getElementById(targetTabId);
            if (targetEl) targetEl.classList.remove('hidden');

            // Mengatur status aktif pada menu navigation/sidebar
            const semuaMenu = document.querySelectorAll('.menu-navigasi-item');
            semuaMenu.forEach(menu => menu.classList.remove('active', 'bg-slate-700', 'text-white'));
            
            if (elemenMenu) {
                elemenMenu.classList.add('active', 'bg-slate-700', 'text-white');
            }

            // Pemicu otomatis load data jika kelas sudah dipilih dan berpindah ke tab tertentu
            if (!kelasAktifGlobal.id) return;
            
            if (targetTabId === 'konten-peserta') {
                muatDataSiswaEksisting();
            } else if (targetTabId === 'konten-soal') {
                muatBankSoal();
            } else if (targetTabId === 'konten-nilai') {
                muatRekapNilai();
            }
        }

        function aturKelasAktif(idKelas, namaKelas) {
            kelasAktifGlobal.id = idKelas;
            kelasAktifGlobal.nama = namaKelas;

            // Update indikator teks kelas aktif di UI
            const labelKelas = document.querySelectorAll('.label-kelas-aktif');
            labelKelas.forEach(el => {
                el.innerText = namaKelas;
            });

            // Buka akses section manajemen setelah kelas dipilih
            const panelManajemen = document.getElementById('panel-manajemen-utama');
            if (panelManajemen) panelManajemen.classList.remove('hidden');

            // Default arahkan ke tab peserta saat kelas dipilih
            const menuPeserta = document.getElementById('menu-nav-peserta');
            gantiTabMenu('konten-peserta', menuPeserta);
        }

        function muatDaftarKelasMaster() {
            const containerKelas = document.getElementById('containerDaftarKelas');
            if (!containerKelas) return;

            containerKelas.innerHTML = `<div class="text-slate-400 text-sm p-3"><i class="fa-solid fa-spinner animate-spin"></i> Memuat daftar kelas...</div>`;

            fetch(`${API_URL}?action=ambilDaftarKelas`)
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success' && res.data.length > 0) {
                    containerKelas.innerHTML = "";
                    res.data.forEach(kelas => {
                        containerKelas.innerHTML += `
                            <button onclick="aturKelasAktif('${kelas.id_kelas}', '${kelas.nama_kelas}')" 
                                    class="w-full text-left px-4 py-3 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700 transition flex justify-between items-center text-white mb-2">
                                <span><i class="fa-solid fa-door-open text-amber-400 me-2"></i> ${kelas.nama_kelas}</span>
                                <span class="text-xs font-mono text-slate-400">ID: ${kelas.id_kelas}</span>
                            </button>
                        `;
                    });
                } else {
                    containerKelas.innerHTML = `<div class="text-muted text-sm p-3">Belum ada kelas terdaftar di database.</div>`;
                }
            })
            .catch(() => {
                containerKelas.innerHTML = `<div class="text-danger text-sm p-3">Gagal mengambil daftar master kelas.</div>`;
            });
        }

        function tambahKelasBaruManual(e) {
            e.preventDefault();
            const namaKelasInput = document.getElementById('inputNamaKelasBaru');
            if (!namaKelasInput.value.trim()) return alert("Nama kelas tidak boleh kosong!");

            document.getElementById('loader-halaman').classList.remove('hidden');

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'tambahKelasBaru',
                    nama_kelas: namaKelasInput.value.trim().toUpperCase()
                })
            })
            .then(res => res.json())
            .then(res => {
                alert(res.message);
                namaKelasInput.value = "";
                muatDaftarKelasMaster();
            })
            .catch(() => alert("Gagal mendistribusikan kelas baru ke server cloud."))
            .finally(() => document.getElementById('loader-halaman').classList.add('hidden'));
        }

        // ==========================================
        // BAGIAN 5: INITIALIZATION & EVENT LISTENERS
        // ==========================================

        document.addEventListener("DOMContentLoaded", function() {
            // 1. Muat database daftar kelas di sidebar sebelah kiri
            muatDaftarKelasMaster();

            // 2. Hubungkan form submit penambahan kelas manual
            const formKelas = document.getElementById('formTambahKelas');
            if (formKelas) {
                formKelas.addEventListener('submit', tambahKelasBaruManual);
            }

            // 3. Hubungkan form submit penambahan single bank soal
            const formSoal = document.getElementById('formSoalTunggal');
            if (formSoal) {
                formSoal.addEventListener('submit', simpanSoalTunggal);
            }

            // 4. Hubungkan trigger deteksi otomatis jenis soal (PG / Isian)
            const selectJenisSoal = document.getElementById('soalJenis');
            if (selectJenisSoal) {
                selectJenisSoal.addEventListener('change', aturFormPilihan);
            }

            // 5. Hubungkan trigger refresh database bank soal berdasarkan mapel
            const selectMapelDb = document.getElementById('pilihMapelDatabase');
            if (selectMapelDb) {
                selectMapelDb.addEventListener('change', muatBankSoal);
            }
        });
    </script>
</body>
</html>
