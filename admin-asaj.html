<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - ASAJ SDN Ranuklindungan I</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    }
    .font-kids-title { font-family: 'Fredoka One', cursive; }
    .btn-3d { transition: all 0.1s ease; }
    .btn-3d:active {
      transform: translateY(6px) !important;
      box-shadow: 0 2px 0 rgba(0,0,0,0.2) !important;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col justify-center items-center p-4 text-white relative">

<!-- ================= LOADER ================= -->
<div id="loader-halaman" class="hidden fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex flex-col items-center justify-center z-50">
  <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
</div>

<!-- ================= POPUP PILIH KELAS ================= -->
<div id="popupPilihKelas" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-40">
  <div class="bg-slate-800 rounded-3xl max-w-3xl w-full p-8 text-center border-4 border-blue-500/50">
    <h2 class="text-4xl font-kids-title text-blue-400 mb-2">Hiii.... Guru</h2>
    <p class="text-slate-300 font-semibold mb-8">Silahkan pilih kelas</p>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
      <button onclick="verifikasiAksesKelas('KLS-04','Kelas 4')" class="btn-3d py-4 rounded-2xl font-bold text-black"
        style="background:#FFB703;box-shadow:0 8px 0 #CC9202;">Kelas 4</button>

      <button onclick="verifikasiAksesKelas('KLS-05','Kelas 5')" class="btn-3d py-4 rounded-2xl font-bold text-white"
        style="background:#9B5DE5;box-shadow:0 8px 0 #7C4AB7;">Kelas 5</button>

      <button onclick="verifikasiAksesKelas('KLS-06','Kelas 6')" class="btn-3d py-4 rounded-2xl font-bold text-slate-900"
        style="background:#00F5D4;box-shadow:0 8px 0 #00C4AA;">Kelas 6</button>
    </div>
  </div>
</div>

<!-- ================= POPUP LOGIN ================= -->
<div id="popupFormGuru" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-40">
  <div class="bg-white text-slate-800 rounded-3xl max-w-md w-full p-6 border-4 border-indigo-500">
    <h3 id="judulForm" class="text-xl font-bold text-indigo-600 mb-4 text-center">
      Login Admin Guru
    </h3>

    <form id="formAdmin" onsubmit="prosesForm(event)" class="space-y-4">
      <input type="hidden" id="form_id_kelas">
      <input type="hidden" id="form_nama_kelas">

      <div>
        <label class="text-xs font-bold text-slate-500">Username</label>
        <input id="form_username" required class="form-control">
      </div>

      <div>
        <label class="text-xs font-bold text-slate-500">Password</label>
        <input type="password" id="form_password" required class="form-control">
      </div>

      <button class="btn btn-primary w-100 fw-bold">Masuk Panel Admin</button>
    </form>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboardUtama" class="hidden w-full max-w-7xl bg-slate-800 rounded-3xl p-6 text-white mt-10">
  <h1 id="txtSelamatDatang" class="text-3xl font-kids-title text-blue-400"></h1>
  <p id="txtDetailKelas" class="text-slate-400 mb-4"></p>
  <!-- ISI DASHBOARD ANDA TETAP -->
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxZO_VfKAa8VC8SpAr-jIhYa82wpeHqTH6iYVJV6uclV1YpYRL7QeqboB6v2Z6Apd1i-A/exec';
let kelasAktifGlobal = {};
let modeForm = 'LOGIN';

window.addEventListener('DOMContentLoaded', () => {
  const sesi = localStorage.getItem('asaj_admin_session');
  if (sesi) {
    const d = JSON.parse(sesi);
    kelasAktifGlobal = { id: d.id_kelas, nama: d.nama_kelas };
    document.getElementById('popupPilihKelas').classList.add('hidden');
    document.getElementById('dashboardUtama').classList.remove('hidden');
    document.getElementById('txtSelamatDatang').innerText = `Selamat Datang, ${d.nama_guru}`;
    document.getElementById('txtDetailKelas').innerText = d.nama_kelas;
  }
});

function verifikasiAksesKelas(id, nama) {
  kelasAktifGlobal = { id, nama };
  document.getElementById('popupPilihKelas').classList.add('hidden');
  document.getElementById('popupFormGuru').classList.remove('hidden');
  document.getElementById('form_id_kelas').value = id;
  document.getElementById('form_nama_kelas').value = nama;
}

function prosesForm(e) {
  e.preventDefault();
  const user = form_username.value;
  const pass = form_password.value;

  document.getElementById('loader-halaman').classList.remove('hidden');

  fetch(`${API_URL}?action=loginGuru&id_kelas=${kelasAktifGlobal.id}&username=${user}&password=${pass}`)
    .then(r => r.json())
    .then(r => {
      document.getElementById('loader-halaman').classList.add('hidden');
      if (r.status === 'success') {
        localStorage.setItem('asaj_admin_session', JSON.stringify({
          id_kelas: kelasAktifGlobal.id,
          nama_kelas: kelasAktifGlobal.nama,
          nama_guru: r.nama_guru
        }));
        location.reload();
      } else {
        alert(r.message);
      }
    });
}
</script>
</body>
</html>
