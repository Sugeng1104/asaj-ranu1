<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Proktor ASAJ - SDN Ranuklindungan I</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 px-8 py-5 shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-black text-slate-800 tracking-tight uppercase">Panel Utama Proktor (Admin)</h1>
                <p class="text-xs font-bold text-blue-600 tracking-widest uppercase mt-0.5">ASAJ SDN Ranuklindungan I TA 2025/2026</p>
            </div>
            
            <div class="flex items-center gap-3 bg-slate-50 p-1.5 rounded-2xl border border-slate-200">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider pl-3">Pilih Monitor Kelas:</span>
                <select id="filter-kelas-global" onchange="gantiMonitorKelas(this.value)" class="bg-white border border-slate-200 rounded-xl px-4 py-2 font-bold text-slate-700 outline-none shadow-sm cursor-pointer focus:ring-2 focus:ring-blue-500/20">
                    <option value="KLS-04">KLS-04 (Kelas 4)</option>
                    <option value="KLS-01">KLS-01 (Kelas 1)</option>
                    <option value="KLS-02">KLS-02 (Kelas 2)</option>
                    <option value="KLS-03">KLS-03 (Kelas 3)</option>
                    <option value="KLS-05">KLS-05 (Kelas 5)</option>
                    <option value="KLS-06">KLS-06 (Kelas 6)</option>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-7xl w-full mx-auto p-6 flex-grow grid grid-cols-1 gap-8">
        
        <div class="bg-white rounded-3xl p-6 border border-slate-100 shadow-md">
            <h2 class="text-lg font-extrabold text-slate-800 mb-4 uppercase tracking-tight flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                Status Ujian Real-Time Siswa
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-100 text-[11px] font-bold text-slate-400 uppercase tracking-wider bg-slate-50">
                            <th class="py-3 px-4">ID Siswa</th>
                            <th class="py-3 px-4">Nama Lengkap</th>
                            <th class="py-3 px-4">Username & Token</th>
                            <th class="py-3 px-4 text-center">Status</th>
                            <th class="py-3 px-4 text-right">Nilai Sementara</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-realtime-siswa" class="divide-y divide-slate-50 text-sm font-semibold text-slate-700">
                        <tr><td colspan="5" class="text-center py-6 text-slate-400">Memuat status siswa...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-6 border border-slate-100 shadow-md">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 pb-5 mb-5">
                <div>
                    <h2 class="text-lg font-extrabold text-slate-800 uppercase tracking-tight">Database Soal Terpasang</h2>
                    <p class="text-xs font-medium text-slate-400 mt-0.5">Kelola butir soal ujian yang bersumber dari Master_Soal spreadsheet</p>
                </div>

                <div class="flex flex-wrap items-center gap-2.5 bg-blue-50/50 p-2 rounded-2xl border border-blue-100/70">
                    <label class="text-xs font-bold text-blue-500 uppercase tracking-wider pl-2">Mata Pelajaran:</label>
                    <select id="dropdown-pilih-mapel" class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-700 outline-none shadow-sm cursor-pointer">
                        <option value="">-- Memuat Mapel --</option>
                    </select>
                    <button onclick="aktifkanMataPelajaran()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-4 py-2 rounded-xl shadow-sm transition-all active:scale-95 cursor-pointer uppercase tracking-wider">
                        Aktifkan
                    </button>
                </div>
            </div>
