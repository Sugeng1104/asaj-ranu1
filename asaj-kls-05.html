<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <style>

<body class="bg-[#f8fafc] min-h-screen flex flex-col">

<!-- =================== SELURUH HTML TIDAK DIUBAH =================== -->
<!-- LOGIN, HEADER, SOAL, TIMER, MODAL SUKSES SAMA PERSIS DENGAN ASLI -->
<!-- =================== SELURUH HTML TIDAK DIUBAH =================== -->

<script>
/* =====================================================
   API CONFIGURATION (SESUI DISKUSI)
===================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxZO_VfKAa8VC8SpAr-jIhYa82wpeHqTH6iYVJV6uclV1YpYRL7QeqboB6v2Z6Apd1i-A/exec';
const API_URL_REKAP = 'https://script.google.com/macros/s/AKfycbycogxYTBE7jofYCJJgXh2Do3ZM2DGsxqPxfHcJOGpolEiuoguR078Oxy1kvzsN8xmb/exec';

const GITHUB_USERNAME = 'sugeng1104';
const GITHUB_REPO = 'asaj-ranu1';

/* ================= VARIABEL GLOBAL ================= */
let dataSoalUjian = [];
let indexSoalAktif = 0;
let mapJawabanSiswa = {};
let sisaWaktuDetik = 90 * 60;
let intervalTimer = null;
let mapelPilihanSiswa = "";
let streamKamera = null;

/* ================= FUNGSI LAIN TETAP ================= */
/* (SEMUA FUNGSI ANDA DARI DOMContentLoaded
   SAMPAI soalBerikutnya()
   TIDAK DIUBAH SAMA SEKALI) */

/* =====================================================
   FUNGSI YANG DIMODIFIKASI (SESUI DISKUSI)
===================================================== */
function kirimKeSpreadsheetOtomatis(statusUjian, callback) {
    const dataSiswa = JSON.parse(localStorage.getItem("sesi_siswa_asaj_kls4"));
    if (!dataSiswa || dataSoalUjian.length === 0) return 0;

    let totalSkorSiswa = 0;
    let barisJawaban = [];

    dataSoalUjian.forEach((soal, idx) => {
        const ans = (mapJawabanSiswa[idx] || "").toString().trim().toUpperCase();
        const key = (soal.kunci_jawaban || "").toString().trim().toUpperCase();
        const bobot = Number(soal.bobot_nilai || 0);

        barisJawaban.push(`${idx + 1}:${ans === "" ? "-" : ans}`);
        if (ans === key && key !== "") totalSkorSiswa += bobot;
    });

    const payload = {
        action: "simpanJawabanSiswa",
        id_siswa: dataSiswa.id_siswa || dataSiswa.ID_SISWA || "-",
        id_kelas: "KLS-04",
        mata_pelajaran: mapelPilihanSiswa,
        daftar_jawaban: barisJawaban.join(", "),
        nilai_akhir: totalSkorSiswa,
        status_ujian: statusUjian
    };

    // API UTAMA
    const kirimUtama = fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
    });

    // HITUNG BOBOT TOTAL
    const bobotTotal = dataSoalUjian.reduce(
        (t, s) => t + Number(s.bobot_nilai || 0), 0
    );

    // API REKAP NILAI
    const kirimRekap = fetch(API_URL_REKAP, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
            id_kelas: "KLS-04",
            id_siswa: payload.id_siswa,
            nama_lengkap: dataSiswa.nama_lengkap || dataSiswa.NAMA_LENGKAP || "",
            agama: dataSiswa.agama || dataSiswa.AGAMA || "",
            mata_pelajaran: payload.mata_pelajaran,
            nilai_bobot_betul: totalSkorSiswa,
            bobot_total: bobotTotal
        })
    });

    Promise.allSettled([kirimUtama, kirimRekap])
        .then(() => {
            if (callback) callback(totalSkorSiswa);
        })
        .catch(() => {
            if (callback) callback(totalSkorSiswa);
        });

    return totalSkorSiswa;
}

/* ================= FUNGSI LAIN TETAP ================= */
</script>

</body>
</html>
