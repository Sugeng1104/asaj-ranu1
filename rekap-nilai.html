<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Rekap Nilai Siswa</title>

<style>
:root{
  --primary:#1e3a8a;
  --secondary:#f1f5f9;
  --accent:#22c55e;
}
body{
  margin:0;
  font-family:Segoe UI, Arial, sans-serif;
  background:#f8fafc;
}
header{
  background:var(--primary);
  color:white;
  padding:18px 24px;
  font-size:20px;
  font-weight:600;
}
.container{
  padding:24px;
}
.toolbar{
  display:flex;
  gap:16px;
  align-items:center;
  margin-bottom:16px;
}
select{
  padding:6px 10px;
  font-size:14px;
}
.summary{
  display:flex;
  gap:20px;
  margin-bottom:16px;
}
.card{
  background:white;
  padding:12px 18px;
  border-radius:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}
table{
  width:100%;
  border-collapse:collapse;
  background:white;
}
th,td{
  border:1px solid #e5e7eb;
  padding:6px;
  text-align:center;
  font-size:13px;
}
thead th{
  background:var(--secondary);
  position:sticky;
  top:0;
  z-index:1;
}
.rank-1{background:#fde047;}
.rank-2{background:#e5e7eb;}
.rank-3{background:#fcd34d;}
</style>
</head>

<body>

<header>📊 Dashboard Rekap Nilai Siswa</header>

<div class="container">

  <div class="toolbar">
    <label>Filter Kelas:</label>
    <select id="filterKelas">
      <option value="">Semua Kelas</option>
    </select>
  </div>

  <div class="summary">
    <div class="card">Jumlah Siswa: <b id="totalSiswa">0</b></div>
    <div class="card">Rata-rata Nilai: <b id="rataGlobal">0</b></div>
  </div>

  <table id="tabel">
    <thead>
      <tr>
        <th rowspan="2">Rank</th>
        <th rowspan="2">Kelas</th>
        <th rowspan="2">ID Siswa</th>
        <th rowspan="2">Nama</th>
        <th colspan="10">Nilai</th>
        <th rowspan="2">Rata-rata</th>
      </tr>
      <tr>
        <th>Agama</th><th>Indo</th><th>Pancasila</th><th>MTK</th>
        <th>IPAS</th><th>Seni</th><th>Jawa</th><th>Inggris</th>
        <th>PJOK</th><th>BTQ</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

</div>

<script>
const URL =
"https://docs.google.com/spreadsheets/d/1q2hQ_qvqQLO_IE3M7dIxYBmK4M7gWh0A_9lIknjlyrQ/gviz/tq?sheet=Jawaban_Siswa";

const MAPEL = {
 "Agama":"Agama","Bahasa Indonesia":"Indo","Pancasila":"Pancasila",
 "Matematika":"MTK","IPAS":"IPAS","Kesenian":"Seni",
 "Bahasa Jawa":"Jawa","Bahasa Inggris":"Inggris","PJOK":"PJOK","BTQ":"BTQ"
};

fetch(URL).then(r=>r.text()).then(t=>{
 const rows=JSON.parse(t.substring(47).slice(0,-2)).table.rows;
 const data={}; const kelasSet=new Set();

 rows.forEach(r=>{
   const id=r.c[2]?.v, kelas=r.c[3]?.v, mapel=r.c[4]?.v, nilai=r.c[6]?.v||0;
   if(!data[id]){
     data[id]={kelas,id,nama:id,nilai:{},avg:0};
     Object.values(MAPEL).forEach(m=>data[id].nilai[m]=0);
   }
   data[id].nilai[MAPEL[mapel]]=nilai;
   kelasSet.add(kelas);
 });

 const arr=Object.values(data).map(d=>{
   const total=Object.values(d.nilai).reduce((a,b)=>a+b,0);
   d.avg=(total/10).toFixed(2);
   return d;
 }).sort((a,b)=>b.avg-a.avg);

 const kelasSel=document.getElementById("filterKelas");
 kelasSet.forEach(k=>kelasSel.innerHTML+=`<option>${k}</option>`);

 function render(){
  const f=kelasSel.value;
  const tb=document.querySelector("tbody"); tb.innerHTML="";
  let rank=1,total=0,cnt=0;
  arr.filter(d=>!f||d.kelas===f).forEach(d=>{
   total+=Number(d.avg); cnt++;
   const tr=document.createElement("tr");
   if(rank<=3) tr.classList.add("rank-"+rank);
   tr.innerHTML=`
    <td>${rank++}</td><td>${d.kelas}</td><td>${d.id}</td><td>${d.nama}</td>
    ${Object.values(d.nilai).map(v=>`<td>${v}</td>`).join("")}
    <td><b>${d.avg}</b></td>`;
   tb.appendChild(tr);
  });
  document.getElementById("totalSiswa").textContent=cnt;
  document.getElementById("rataGlobal").textContent=(total/cnt||0).toFixed(2);
 }
 kelasSel.onchange=render;
 render();
});
</script>

</body>
</html>
