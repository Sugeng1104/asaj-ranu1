<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Rekap Nilai Siswa</title>

<style>
:root{
  --primary:#1e40af;
  --secondary:#f1f5f9;
  --accent:#fde047;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:#f8fafc;
  color:#111827;
}
header{
  background:var(--primary);
  color:#fff;
  padding:18px 24px;
  font-size:20px;
  font-weight:600;
}
.container{
  padding:24px;
}
.toolbar{
  display:flex;
  gap:16px;
  align-items:center;
  margin-bottom:18px;
}
select{
  padding:6px 10px;
  font-size:14px;
}
.summary{
  display:flex;
  gap:16px;
  margin-bottom:18px;
}
.card{
  background:#fff;
  padding:14px 22px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
  font-size:15px;
}
table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  font-size:13px;
}
th,td{
  border:1px solid #e5e7eb;
  padding:6px;
  text-align:center;
}
thead th{
  background:var(--secondary);
  font-weight:600;
}
.rank-1,.rank-2,.rank-3{
  background:var(--accent);
  font-weight:700;
}
td:last-child{
  font-weight:700;
}
footer{
  margin-top:18px;
  font-size:12px;
  color:#6b7280;
}
</style>
</head>

<body>

<header>📊 Dashboard Rekap Nilai Siswa</header>

<div class="container">

  <div class="toolbar">
    <label><b>Filter Kelas:</b></label>
    <select id="filterKelas">
      <option value="">Semua Kelas</option>
    </select>
  </div>

  <div class="summary">
    <div class="card">Jumlah Siswa: <b id="totalSiswa">0</b></div>
    <div class="card">Rata-rata Nilai: <b id="rataGlobal">0</b></div>
  </div>

  <table id="tabel">
    <thead>
      <tr>
        <th rowspan="2">Rank</th>
        <th rowspan="2">Kelas</th>
        <th rowspan="2">ID Siswa</th>
        <th rowspan="2">Nama</th>
        <th colspan="10">Nilai</th>
        <th rowspan="2">Rata-rata</th>
      </tr>
      <tr>
        <th>Agama</th>
        <th>B. Indonesia</th>
        <th>Pancasila</th>
        <th>MTK</th>
        <th>IPAS</th>
        <th>Seni</th>
        <th>Jawa</th>
        <th>Inggris</th>
        <th>PJOK</th>
        <th>BTQ</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <footer>
    Data ditampilkan berdasarkan ujian dengan status <b>Selesai</b>
  </footer>

</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbycogxYTBE7jofYCJJgXh2Do3ZM2DGsxqPxfHcJOGpolEiuoguR078Oxy1kvzsN8xmb/exec";

const filterKelas = document.getElementById("filterKelas");
const tbody = document.querySelector("#tabel tbody");
const totalSiswaEl = document.getElementById("totalSiswa");
const rataGlobalEl = document.getElementById("rataGlobal");

let allData = [];

function loadData(){
  const kelas = filterKelas.value;
  const url = kelas ? `${API_URL}?kelas=${kelas}` : API_URL;

  fetch(url)
    .then(r=>r.json())
    .then(res=>{
      totalSiswaEl.textContent = res.total_siswa;
      rataGlobalEl.textContent = res.rata_global;
      renderTable(res.data);
      setupFilter(res.data);
    });
}

function renderTable(data){
  tbody.innerHTML = "";
  data.forEach(s=>{
    const tr = document.createElement("tr");
    if(s.rank<=3) tr.classList.add("rank-"+s.rank);
    tr.innerHTML = `
      <td>${s.rank}</td>
      <td>${s.id_kelas}</td>
      <td>${s.id_siswa}</td>
      <td>${s.nama}</td>
      <td>${s.nilai["Agama"]}</td>
      <td>${s.nilai["B. Indonesia"]}</td>
      <td>${s.nilai["Pancasila"]}</td>
      <td>${s.nilai["MTK"]}</td>
      <td>${s.nilai["IPAS"]}</td>
      <td>${s.nilai["Seni"]}</td>
      <td>${s.nilai["Jawa"]}</td>
      <td>${s.nilai["Inggris"]}</td>
      <td>${s.nilai["PJOK"]}</td>
      <td>${s.nilai["BTQ"]}</td>
      <td>${s.rata}</td>
    `;
    tbody.appendChild(tr);
  });
}

function setupFilter(data){
  if(filterKelas.options.length>1) return;
  const kelasSet=new Set(data.map(d=>d.id_kelas));
  kelasSet.forEach(k=>{
    const o=document.createElement("option");
    o.value=k; o.textContent=k;
    filterKelas.appendChild(o);
  });
}

filterKelas.addEventListener("change",loadData);
loadData();
</script>

</body>
</html>
